  prof:null,theme:"",filter:"all",showTr:false,revLimit:100,newLimit:10,mathDrip:true,
  freeMode:false,pool:[],total:0,done:0,lastSid:null,sec:"rw",cat:"dil",cur:null};
function saveProf(){ return setKV("prof",S.prof); }

/* ---------- plan: aşamalar ve deneme günleri / phases and test days ---------- */
/* Prova: sınavdan önceki son 8 hafta. Temel: kalan sürenin %40'ı (en fazla 8 hafta). Arası Hacim. */
function planDates(){
  var p=S.prof, D=daysBetween(p.start,p.exam), prova=addDays(p.exam,-56), hacim;
  if(D<=56){ prova=p.start; hacim=p.start; }
  else hacim=addDays(p.start, Math.min(56, Math.round((D-56)*0.4)));
  return {hacim:hacim, prova:prova};
}
function phaseOf(ds){
  var pd=planDates();
  if(ds>=pd.prova) return 3;
  if(ds>=pd.hacim) return 2;
  return 1;
}
var _td=null,_tdKey="";
/* tam deneme: Pazar. Puan yoksa ilk Pazar (seviye ölçümü), sonra 4 haftada bir; Prova'da 2 haftada bir; sınava 6 günden yakınsa yok */
function testDays(){
  var p=S.prof, key=p.start+p.exam+(p.cur==null?"n":"y");
  if(_td && _tdKey===key) return _td;
  var out=[], d=addDays(p.start, p.cur==null?2:20), pd=planDates(), last=null;
  while(dowOf(d)!==0) d=addDays(d,1);
  while(daysBetween(d,p.exam)>=6){
    if(!last || daysBetween(last,d)>=(d>=pd.prova?14:28)){ out.push(d); last=d; }
    d=addDays(d,7);
  }
  _td=out; _tdKey=key; return out;
}
function isTestDay(ds){ return testDays().indexOf(ds)>=0; }

/* ---------- günlük görevler / daily tasks ---------- */
function qCount(){ var m=S.prof.mins; return m>=90?20:(m>=60?15:10); }
function taskDefs(ds){
  ds=ds||todayStr();
  var p=S.prof, dow=dowOf(ds), ph=phaseOf(ds), m=p.mins, n=qCount(), tl=[];
  var testDay=isTestDay(ds), analDay=isTestDay(addDays(ds,-1));
  var wk=Math.floor(daysBetween(p.start,ds)/7);
  tl.push({id:"kelime",n:t("t_kelime"),s:t("t_kelime_s")});
  tl.push({id:"gramer",n:t("t_gramer"),s:t("t_gramer_s")});
  if(p.esl){
    var read= m>=90 ? (dow>=1&&dow<=6) : m>=60 ? (dow===2||dow===4||dow===6) : dow===6;
    var listen= m>=60 && (dow===1||dow===3||dow===5);
    if(read) tl.push({id:"okuma",n:t("t_okuma"),s:t("t_okuma_s"),u:SNE_URL,ul:t("link_sne")});
    if(listen) tl.push({id:"dinleme",n:t("t_dinleme"),s:t("t_dinleme_s")});
  }
  if(dow===0){
    if(testDay) tl.push({id:"deneme",n:t("t_deneme"),s:t("t_deneme_s"),u:BB_URL,ul:t("link_bb")});
    else {
      tl.push({id:"defter",n:t("t_defter"),s:t("t_defter_s")});
      if(m>=60) tl.push({id:"tekrarq",n:t("t_tekrarq"),s:t("t_tekrarq_s"),u:QB_URL,ul:t("link_qb")});
    }
    return tl;
  }
  if(analDay){ tl.push({id:"analiz",n:t("t_analiz"),s:t("t_analiz_s")}); return tl; }
  var module = dow===6 && (m>=60 || ph===3);
  if(module){
    tl.push(wk%2===0 ? {id:"modul",n:t("t_modul_rw"),s:t("t_modul_rw_s"),u:QB_URL,ul:t("link_qb")}
                     : {id:"modul",n:t("t_modul_m"),s:t("t_modul_m_s"),u:QB_URL,ul:t("link_qb")});
    return tl;
  }
  /* 90 dk Hacim/Prova: her gün ikisi de. Diğerleri: R&W Pzt/Çar/Cum, Math Sal/Per (+Cmt 30 dk'da) */
  var both = m>=90 && ph>1;
  var rwDays = both ? [1,2,3,4,5] : [1,3,5];
  var mDays  = both ? [1,2,3,4,5] : (m<60 ? [2,4,6] : [2,4]);
  if(rwDays.indexOf(dow)>=0){
    var grp = ph===1 ? (dow===3?"okuma":"gramer") : ["gramer","okuma"];
    tl.push({id:"rw",n:t("t_rw",n,Math.round(n*71/60)),s:t("t_rw_s",focusLine(grp)),u:QB_URL,ul:t("link_qb")});
  }
  if(mDays.indexOf(dow)>=0)
    tl.push({id:"mat",n:t("t_mat",n,Math.round(n*95/60)),s:t("t_mat_s",focusLine("mat")),u:QB_URL,ul:t("link_qb")});
  return tl;
}
function renderTasks(){
  var d=todayStr(), done=S.tasks[d]||{}, defs=taskDefs(d), h="", ph=phaseOf(d);
  $("phaseLbl").textContent="· "+t("ph_lbl",S.prof.target,ph,t("ph_names")[ph-1]);
  for(var i=0;i<defs.length;i++){
    var x=defs[i], ok=!!done[x.id];
    h+='<div class="task'+(ok?" done":"")+'" onclick="toggleTask(\''+x.id+'\')">'+
       '<div class="box">✓</div><div class="t">'+esc(x.n)+'<small>'+esc(x.s)+
       (x.u?'<br><a class="tlink" href="'+x.u+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+esc(x.ul)+' ↗</a>':'')+
       '</small></div></div>';
  }
  $("taskList").innerHTML=h;
}
function toggleTask(id){
  var d=todayStr(); if(!S.tasks[d]) S.tasks[d]={};
  S.tasks[d][id]=!S.tasks[d][id];
  setKV("tasks",S.tasks).then(renderToday);
}
function markTask(id){
  var d=todayStr(); if(!S.tasks[d]) S.tasks[d]={};
  if(S.tasks[d][id]) return Promise.resolve();
  S.tasks[d][id]=true; return setKV("tasks",S.tasks).then(renderToday);
}
function streak(){
  var n=0, d=todayStr();
  if(!(S.tasks[d]&&S.tasks[d].kelime)) d=addDays(d,-1);
  while(S.tasks[d]&&S.tasks[d].kelime){ n++; d=addDays(d,-1); }
  return n;
}
function renderToday(){
  var d=todayStr();
  $("todayTitle").textContent=t("days")[dowOf(d)]+", "+fmtDate(d);
  var due=dueWords().length;
  $("stStreak").textContent=streak(); $("stDue").textContent=due; $("stWords").textContent=S.words.length;
  $("nextUp").textContent=due?"":nextUpLine();
  var g=daysBetween(d,S.prof.exam);
  $("stDays").textContent=g>=0?g:"—";
  $("hdrSub").innerHTML=(g>=0?esc(t("exam_in",g))+"<br>":"")+"<span style='opacity:.7'>"+esc(fmtDate(S.prof.exam))+"</span>";
  renderTasks(); renderGauge();
}

/* ---------- beceri odağı + soru kaydı / skill focus + question log ---------- */
function skillById(id){ for(var i=0;i<SKILLS.length;i++) if(SKILLS[i][0]===id) return SKILLS[i]; return null; }
function skillStats(before){
  var st={}; (S.qlog||[]).forEach(function(q){
    if(before && q.d>=before) return;
    var x=st[q.sk]||(st[q.sk]={c:0,n:0,k:0,last:""}); x.c+=q.c; x.n+=q.n; x.k++; if(q.d>x.last) x.last=q.d; });
  return st;
}
/* önce %80 altındaki en zayıf beceri; yoksa sıradaki çalışılmamış beceri (gün içinde değişmez) */
function pickSkill(grp){
  var gs=(typeof grp==="string")?[grp]:grp, st=skillStats(todayStr()), weak=null, wv=1, next=null, last=null;
  var order=SKILL_PRIO.map(skillById).filter(Boolean);
  for(var i=0;i<order.length;i++){
    var s=order[i]; if(gs.indexOf(s[3])<0) continue;
    last=s; var x=st[s[0]];
    if(!x||!x.n){ if(!next) next=s; continue; }
    var v=x.c/x.n; if(v<0.8 && v<wv){ weak=s; wv=v; }
  }
  return weak||next||last;
}
function focusLine(grp){ var s=pickSkill(grp); return s?t("focus",s[1],L(s[2])):""; }
function addQlog(){
  var sk=$("qSk").value, c=parseInt($("qC").value,10), n=parseInt($("qN").value,10);
  if(!sk||isNaN(c)||isNaN(n)||n<=0||c<0||c>n){ alert(t("q_bad")); return; }
  S.qlog=(S.qlog||[]).concat([{d:todayStr(),sk:sk,c:c,n:n}]);
  $("qC").value=""; $("qN").value="";
  setKV("qlog",S.qlog).then(function(){ renderQlog(); renderProgress(); });
}
function renderQlog(){
  var cur=$("qSk").value, dow=dowOf(todayStr());
  var def=(dow===2||dow===4)?pickSkill("mat"):pickSkill("gramer");
  var groups=[["gramer","R&W · Expression / Conventions"],["okuma","R&W · Reading"],["mat","Math"]];
  $("qSk").innerHTML=groups.map(function(g){
    return '<optgroup label="'+g[1]+'">'+SKILLS.filter(function(s){return s[3]===g[0];}).map(function(s){
      return '<option value="'+s[0]+'">'+esc(s[1])+'</option>'; }).join("")+'</optgroup>'; }).join("");
  $("qSk").value=cur||(def?def[0]:SKILLS[0][0]);
  var td=(S.qlog||[]).filter(function(q){return q.d===todayStr();});
  $("qToday").innerHTML=td.length?esc(t("q_today",td.map(function(q){var s=skillById(q.sk);return (s?s[1]:q.sk)+" "+q.c+"/"+q.n;}).join(" · "))):esc(t("q_none"));
}
function skillTableHtml(){
  var st=skillStats(null), rows=[];
  SKILLS.forEach(function(s){ var x=st[s[0]]; if(x&&x.n) rows.push([s,x,x.c/x.n]); });
  if(!rows.length) return '<p class="muted">'+esc(t("p_sk_none"))+'</p>';
  rows.sort(function(a,b){return a[2]-b[2];});
  return rows.map(function(r){
    var pc=Math.round(r[2]*100), col=pc>=80?"var(--ok)":pc>=60?"var(--warn)":"var(--bad)";
    return '<div class="mrow"><div><b>'+esc(r[0][1])+'</b><div class="muted" style="font-size:12px">'+
      (r[0][3]==="mat"?"Math":"R&amp;W")+' · '+esc(t("p_sets",r[1].k))+' · '+r[1].c+'/'+r[1].n+'</div></div>'+
      '<div style="font-weight:800;color:'+col+'">'+(LANG==="tr"?"%"+pc:pc+"%")+'</div></div>';
  }).join("")+'<p class="muted" style="margin-top:8px;font-size:12px">'+esc(t("p_sk_note"))+'</p>';
}

/* ---------- gidişat göstergesi / progress gauge ----------
   Puan yalnız tam denemelerden: son denemeden önceki 14 gündeki denemelerin ortalaması, aralık ±40/√n.
   Eğilim: ≥2 deneme ve ≥14 gün varsa en küçük kareler eğimi (puan/ay). Çalışma düzeni: son 7 gün görev oranı. */
function pct(v){ return LANG==="tr"?"%"+v:v+"%"; }
function gaugeData(){
  var td=todayStr(), ts=S.tests.slice().sort(function(a,b){return a.date<b.date?-1:1;}), r={n:ts.length};
  if(ts.length){
    var last=ts[ts.length-1];
    r.lastAge=daysBetween(last.date,td);
    var recent=ts.filter(function(x){return daysBetween(x.date,last.date)<=14;});
    r.est=Math.round(recent.reduce(function(a,x){return a+x.total;},0)/recent.length/10)*10;
    r.k=recent.length; r.err=Math.round(40/Math.sqrt(recent.length)/5)*5;
    var withSec=recent.filter(function(x){return x.rw!=null&&x.math!=null;});
    if(withSec.length){ r.rw=Math.round(withSec.reduce(function(a,x){return a+x.rw;},0)/withSec.length);
      r.math=Math.round(withSec.reduce(function(a,x){return a+x.math;},0)/withSec.length); }
    if(ts.length>=2 && daysBetween(ts[0].date,last.date)>=14){
      var xs=ts.map(function(x){return daysBetween(ts[0].date,x.date);}), ys=ts.map(function(x){return x.total;});
      var mx=xs.reduce(function(a,b){return a+b;},0)/xs.length, my=ys.reduce(function(a,b){return a+b;},0)/ys.length, num=0, den=0;
      for(var i=0;i<xs.length;i++){ num+=(xs[i]-mx)*(ys[i]-my); den+=(xs[i]-mx)*(xs[i]-mx); }
      if(den>0) r.slope=Math.round(num/den*30.4);
    }
    var left=daysBetween(td,S.prof.exam);
    if(left>0) r.need=Math.max(0,Math.round((S.prof.target-r.est)/(left/30.4)));
    r.left=left;
  }
  var tot=0, dn=0, rev=0, miss={}, counted=0;
  for(var d=1; d<=7; d++){
    var ds=addDays(td,-d); if(ds<S.prof.start) continue;
    counted++;
    var done=S.tasks[ds]||{}, defs=taskDefs(ds);
    tot+=defs.length;
    defs.forEach(function(x){ var mi=miss[x.id]||(miss[x.id]={n:x.n,due:0,ok:0}); mi.due++; if(done[x.id]){ dn++; mi.ok++; } });
    if(done.kelime) rev++;
  }
  r.counted=counted; r.eff=tot?Math.round(dn/tot*100):0; r.revDays=rev;
  r.miss=Object.keys(miss).map(function(k){return miss[k];}).filter(function(m){return m.ok<m.due;})
    .sort(function(a,b){return (a.ok/a.due)-(b.ok/b.due)||b.due-a.due;}).slice(0,4);
  var tdefs=taskDefs(td), tdone=S.tasks[td]||{}, tc=0;
  tdefs.forEach(function(x){ if(tdone[x.id]) tc++; });
  r.today=tc+"/"+tdefs.length;
  var e=r.eff, lb=t("g_lbls");
  r.lbl=!counted?[t("g_new"),"var(--dim)"]: e>=90?[lb[0],"var(--ok)"]:e>=75?[lb[1],"var(--ok)"]:e>=55?[lb[2],"var(--acc)"]:e>=35?[lb[3],"var(--warn)"]:[lb[4],"var(--bad)"];
  return r;
}
function renderGauge(){
  var g=gaugeData();
  $("gScore").textContent=g.n?("≈"+g.est):"—";
  $("gLbl").textContent=g.lbl[0]; $("gLbl").style.color=g.lbl[1];
  if(!$("gPanel").classList.contains("hide")) $("gPanel").innerHTML=gaugeHtml(g);
}
function gaugeHtml(g){
  var h='<div class="gr"><h3>'+esc(t("g_score"))+'</h3>';
  if(!g.n) h+='<div class="muted">'+esc(t("g_none"))+'</div></div>';
  else {
    h+='<div class="big">'+g.est+' <span class="muted" style="font-size:13px">('+Math.max(400,g.est-g.err)+'–'+Math.min(1600,g.est+g.err)+')</span></div>'+
       '<div class="muted">'+(g.rw!=null?'R&amp;W '+g.rw+' · Math '+g.math+' · ':'')+esc(t("g_based",g.k,g.lastAge))+'</div>';
    if(g.lastAge>35) h+='<div style="color:var(--warn);font-size:12.5px;margin-top:3px">'+esc(t("g_old"))+'</div>';
    h+='</div><div class="gr"><h3>'+esc(t("g_trend"))+'</h3>';
    h+=g.slope==null?'<div class="muted">'+esc(t("g_trend_none"))+'</div>'
      :'<div><b>'+(g.slope>=0?"+":"")+g.slope+' '+esc(t("g_perm"))+'</b>'+(g.n<3?' <span class="muted">'+esc(t("g_unrel",g.n))+'</span>':'')+'</div>';
    if(g.need!=null) h+='<div class="muted">'+t("g_need",S.prof.target,g.need,g.left)+'</div>';
    h+='</div>';
  }
  h+='<div class="gr"><h3>'+esc(t("g_eff"))+': <span style="color:'+g.lbl[1]+'">'+esc(g.lbl[0])+'</span></h3>'+
     '<div>'+t("g_eff_line",g.eff,g.revDays,g.today)+'</div>'+
     (g.miss.length?'<div style="margin-top:4px;font-size:13px">'+esc(t("g_miss"))+' '+g.miss.map(function(m){
        return '<b>'+esc(m.n.split(":")[0])+'</b> '+m.ok+'/'+m.due;}).join(" · ")+'</div>':'')+
     '<div class="muted">'+esc(t("g_scale"))+'</div></div><div class="gr muted">'+esc(t("g_note"))+'</div>';
  return h;
}
function toggleGauge(){
  var p=$("gPanel");
  if(p.classList.contains("hide")){ p.innerHTML=gaugeHtml(gaugeData()); p.classList.remove("hide"); }
  else p.classList.add("hide");
}
document.addEventListener("click",function(e){
  var p=$("gPanel"); if(!p||p.classList.contains("hide")) return;
  if(!p.contains(e.target) && !$("gPill").contains(e.target)) p.classList.add("hide");
});

/* ---------- kelime paketleri / word packs ---------- */
var ACAD_PER_DAY=1, MATH_PER_DAY=3, DRIPPED=false;
/* akademik: günde 1 kelime kutuya düşer (cümleyi kullanıcı yazar). matematik: günde 3 terim tekrara girer. */
function dripPack(){
  if(DRIPPED || !S.prof) return; DRIPPED=true;
  var td=todayStr(), i, done=0, ops=[], added=false;
  S.inbox=S.inbox||[];
  S.inbox.forEach(function(x){ if(x.src==="akademik" && x.d===td) done++; });
  S.words.forEach(function(w){ if(w.src==="akademik" && w.created===td) done++; });
  var need=ACAD_PER_DAY-done;
  for(i=0;i<ACAD_PACK.length && need>0;i++){
    var w=ACAD_PACK[i][0];
    if(findWord(w) || S.inbox.some(function(x){return slug(x.w)===slug(w);})) continue;
    S.inbox.push({id:nowMs()+i, w:w, d:td, src:"akademik", ex:ACAD_PACK[i][1]});
    need--; added=true;
  }
  if(S.mathDrip){
    var md=0; S.words.forEach(function(w){ if(w.src==="matematik" && w.created===td) md++; });
    var mneed=MATH_PER_DAY-md;
    for(i=0;i<MATH_PACK.length && mneed>0;i++){
      var m=MATH_PACK[i]; if(findWord(m[0])) continue;
      var o={word:m[0], mk:i, src:"matematik", sen:(m[3]?m[3]+"  ·  ":"")+"Math · "+t("m_groups")[m[2]],
             created:td, due:td, lvl:1, step:0, reps:0, sid:slug(m[0])};
      ops.push(sPut("words",o)); mneed--;
    }
  }
  if(added) ops.push(saveInbox());
  if(ops.length) Promise.all(ops).then(load);
}
/* matematik terimlerinin anlamı dile göre gösterilir / math term meaning follows the language */
function meanOf(w){ if(w.meanEdited) return w.mean||""; if(w.src==="matematik" && w.mk!=null && MATH_PACK[w.mk]) return L(MATH_PACK[w.mk][1]); if(w.src==="akademik" && !w.mean) return acadMean(w.word); return w.mean||""; }
function acadMean(word){ for(var i=0;i<ACAD_PACK.length;i++) if(ACAD_PACK[i][0]===word) return L(ACAD_PACK[i][2]); return ""; }

function renderMath(){
  var q=($("mathQ").value||"").toLowerCase().trim(), h="", total=0, inRev=0, G=["q","geo","basic"];
  G.forEach(function(g){
    var rows="", n=0;
    MATH_PACK.forEach(function(m){
      if(m[2]!==g) return;
      var has=!!findWord(m[0]); total++; if(has) inRev++;
      var mean=L(m[1]);
      if(q && (m[0]+" "+mean).toLowerCase().indexOf(q)<0) return;
      n++;
      rows+='<div class="mrow"><div><b>'+esc(m[0])+'</b>'+(m[3]?' <span class="mex">'+esc(m[3])+'</span>':'')+
            '</div><div class="mtr">'+esc(mean)+(has?' <span class="mtag">'+esc(t("m_in"))+'</span>':'')+'</div></div>';
    });
    if(n) h+='<details class="card"'+(q?' open':'')+'><summary><b>'+esc(t("m_groups")[g])+'</b> <span class="muted">('+n+')</span></summary>'+rows+'</details>';
  });
  $("mathList").innerHTML=h||'<p class="muted">'+esc(t("none"))+'</p>';
  $("mathInfo").textContent=t("m_info",total,inRev)+(S.mathDrip?t("m_info_drip"):"");
}

/* ---------- kelime kutusu / word box ---------- */
var INB_PROC=false;
function renderNotes(){
  var ib=S.inbox||[];
  $("noteCnt").textContent=ib.length; $("noteCnt").classList.toggle("hide",!ib.length);
  $("inbGo").disabled=!ib.length;
  $("inbGo").textContent=ib.length?t("inb_go_n",ib.length):t("inb_empty");
  $("noteList").innerHTML=ib.map(function(x,i){
    return '<div class="nitem" style="display:flex;align-items:center;gap:8px"><span class="muted" style="width:20px">'+(i+1)+'</span>'+
      '<b style="flex:1">'+esc(x.w)+(x.src==="akademik"?' <span class="mtag" style="color:var(--acc);border-color:var(--acc)">'+esc(t("tag_acad"))+'</span>':'')+'</b>'+
      '<button class="sm ghost" onclick="processInbox('+x.id+')">'+esc(t("process"))+'</button>'+
      '<button class="sm ghost" onclick="delInbox('+x.id+')">'+esc(t("del"))+'</button></div>';
  }).join("");
}
function saveInbox(){ return setKV("inbox",S.inbox).then(renderNotes); }
function addInbox(){
  var raw=$("inbIn").value; if(!raw.trim()) return;
  var parts=raw.split(/\n|;/).map(function(x){return x.trim();}).filter(Boolean), t0=nowMs();
  parts.forEach(function(w,i){
    if(S.inbox.some(function(x){return slug(x.w)===slug(w);})) return;
    S.inbox.push({id:t0+i, w:w, d:todayStr()});
  });
  $("inbIn").value=""; $("inbIn").focus(); saveInbox();
}
function inbPaste(e){
  var x=(e.clipboardData||window.clipboardData).getData("text");
  if(x && /\n/.test(x)){ e.preventDefault(); $("inbIn").value=x.split(/\r?\n/).join(";"); addInbox(); }
}
function delInbox(id){ S.inbox=S.inbox.filter(function(x){return x.id!==id;}); saveInbox(); }
function processInbox(id){
  var ib=S.inbox; if(!ib.length) return;
  var it=ib[0]; if(id!=null) ib.forEach(function(x){ if(x.id===id) it=x; });
  INB_PROC=true;
  $("notePanel").classList.add("hide");
  go("kelime"); kwView("w");
  $("wWord").value=it.w; $("wSen").value=""; $("wMean").value=it.src==="akademik"?acadMean(it.w):"";
  if(it.ex) $("wSen").placeholder=it.ex;
  checkDup(); $("inbHint").classList.remove("hide");
  $("inbHint").textContent=t("inb_proc",ib.length);
  setTimeout(function(){ $("wSen").focus(); },80);
}
function inboxAfterSave(word){
  var s0=slug(word), before=S.inbox.length;
  S.inbox=S.inbox.filter(function(x){return slug(x.w)!==s0;});
  var p=(S.inbox.length!==before)?saveInbox():Promise.resolve();
  return p.then(function(){
    if(!INB_PROC) return;
    if(S.inbox.length) processInbox();
    else { INB_PROC=false; $("inbHint").classList.remove("hide"); $("inbHint").textContent=t("inb_done"); }
  });
}

  var p=$("notePanel"); p.classList.toggle("hide");

}

function addRoot(){
  var r=$("rRoot").value.trim(), m=$("rMean").value.trim(), o=$("rOrig").value.trim();
  if(!r||!m){ alert(t("r_need")); return; }
  if(S.roots.some(function(x){return x.r.toLowerCase()===r.toLowerCase();})){ alert(t("r_dup")); return; }

function findRoot(id){ for(var i=0;i<S.roots.length;i++) if(S.roots[i].id===id) return S.roots[i]; return null; }
function addDeriv(id){

  var w=$("dw"+id).value.trim(), m=$("dm"+id).value.trim(); if(!w) return;
  R.d.push({w:w,m:m}); saveRoots().then(function(){ var x=$("dw"+id); if(x) x.focus(); });

function delDeriv(id,k){ var R=findRoot(id); if(!R) return; R.d.splice(k,1); saveRoots(); }
function delRoot(id){ if(!confirm(t("r_delq"))) return; S.roots=S.roots.filter(function(x){return x.id!==id;}); saveRoots(); }

/* ---------- aralıklı tekrar / spaced repetition ---------- */
function lvlOf(w){ return w.lvl==null?1:w.lvl; }
function weightOf(w){ var l=lvlOf(w); return l===0?6:(l===1?3:(l===2?1.5:0.5)); }
function lvlColor(w){ var l=lvlOf(w); return l===0?"var(--bad)":(l===1?"var(--warn)":(l===2?"var(--ok)":"var(--acc)")); }
function lvlName(w){ return t("lv")[lvlOf(w)]; }
function capOf(w){ return lvlOf(w)===0?2:1; }          /* zor kelime günde en fazla 2 kez */
function viewsToday(w){ return w.seenDate===todayStr()?(w.seenCount||0):0; }
function isNew(w){ return !(w.reps>0) && !w.firstSeen; }
function viewedTodayTotal(){ return S.words.reduce(function(a,w){return a+viewsToday(w);},0); }
function introducedToday(){ var td=todayStr(); return S.words.filter(function(w){return w.firstSeen===td;}).length; }
function eligible(){ var td=todayStr(); return S.words.filter(function(w){ return (!w.due||w.due<=td) && viewsToday(w)<capOf(w); }); }
function dueWords(){
  var td=todayStr(), all=eligible();
  var fresh=all.filter(isNew).sort(function(a,b){return (a.created||"")<(b.created||"")?-1:1;});
  var rev=all.filter(function(w){return !isNew(w);}).sort(function(a,b){
    var da=daysBetween(a.due||td,td), db=daysBetween(b.due||td,td);
    return db!==da?db-da:lvlOf(a)-lvlOf(b);
  });
  var newLeft=Math.max(0,S.newLimit-introducedToday()), slots=Math.max(0,S.revLimit-viewedTodayTotal());
  var newTake=Math.min(newLeft,slots,fresh.length);
  return rev.slice(0,slots-newTake).concat(fresh.slice(0,newTake));
}
function nextUpLine(){
  var td=todayStr(), best=null;
  S.words.forEach(function(w){ if(w.due && w.due>td && (!best||w.due<best)) best=w.due; });
  if(!best) return "";
  return t("rev_next",S.words.filter(function(w){return w.due===best;}).length,fmtDate(best));
}
function limitLine(){ return t("rev_limit",viewedTodayTotal(),S.revLimit,introducedToday(),S.newLimit); }
function weightedShuffle(arr){
  return arr.map(function(w){return {w:w,k:Math.pow(Math.random(),1/weightOf(w))};})
    .sort(function(a,b){return b.k-a.k;}).map(function(x){return x.w;});
}
function findWord(txt){ var s=slug(txt); for(var i=0;i<S.words.length;i++) if(slug(S.words[i].word)===s) return S.words[i]; return null; }
function checkDup(){
  var txt=$("wWord").value.trim(), box=$("dupBox"), ex=txt?findWord(txt):null;
  if(!ex){ box.classList.add("hide"); $("btnSave").textContent=t("save"); return; }
  box.classList.remove("hide");
  box.innerHTML="<b>"+esc(t("w_dup"))+"</b><div style='margin-top:5px'>"+esc(meanOf(ex)||t("no_mean"))+"</div>"+
    (ex.sen?"<div style='font-style:italic;opacity:.8;margin-top:4px'>"+esc(ex.sen)+"</div>":"")+
    "<div style='margin-top:6px;opacity:.75'>"+esc(t("w_state",lvlName(ex),ex.reps||0))+"</div>";
  $("btnSave").textContent=t("w_update");
}
function addWord(){
  var txt=$("wWord").value.trim(); if(!txt){ alert(t("w_empty")); return; }
  var sen=$("wSen").value.trim(), mean=$("wMean").value.trim(), ex=findWord(txt), o;
  if(ex){ o=ex; if(sen) o.sen=sen; if(mean && mean!==meanOf(ex)){ o.mean=mean; o.meanEdited=true; } }
  else o={word:txt,sen:sen,mean:mean,created:todayStr(),due:todayStr(),lvl:1,step:0,reps:0,sid:slug(txt)};
  if(!ex && INB_PROC && S.inbox.some(function(x){return slug(x.w)===slug(txt)&&x.src==="akademik";})){ o.src="akademik"; if(mean===acadMean(txt)) o.mean=""; else o.meanEdited=true; }
  o.upd=nowMs();
  sPut("words",o).then(load).then(function(){
    $("wWord").value=""; $("wSen").value=""; $("wMean").value=""; $("wSen").placeholder="such concerns didn't ___ her efforts";
    $("dictOut").innerHTML=""; $("dupBox").classList.add("hide");
    $("btnSave").textContent=t("save"); $("wWord").focus(); $("inbHint").classList.add("hide");
    return inboxAfterSave(txt);
  });
}

function startReview(allWords){ S.freeMode=!!allWords; S.pool=buildRound(); S.total=S.pool.length; S.done=0; S.lastSid=null; nextCard(); }
function buildRound(){
  var base=S.freeMode?S.words.filter(function(w){return viewsToday(w)<capOf(w);}):dueWords();
  var g1=[],g2=[],g3=[];   /* sıra: tekrar → yeni → matematik */
  base.forEach(function(w){ if(w.src==="matematik") g3.push(w); else if(isNew(w)) g2.push(w); else g1.push(w); });
  var r=weightedShuffle(g1).concat(weightedShuffle(g2),weightedShuffle(g3));
  if(r.length>1 && r[0].sid===S.lastSid){ var x=r[0]; r[0]=r[1]; r[1]=x; }
  return r;
}
function nextCard(){
  if(!S.pool||!S.pool.length) S.pool=buildRound();
  if(!S.pool.length){
    S.cur=null; $("revBox").classList.add("hide"); $("revEmpty").classList.remove("hide");
    var waiting=eligible().length;
    $("revEmptyMsg").textContent=waiting>0?t("rev_capped",waiting,limitLine()):(S.words.length?t("rev_nothing",limitLine(),nextUpLine()):t("rev_empty"));
    return;
  }
  S.cur=S.pool[0];
  $("revEmpty").classList.add("hide"); $("revBox").classList.remove("hide");
  var grp=S.cur.src==="matematik"?t("rev_grp_math"):(isNew(S.cur)?t("rev_grp_new"):t("rev_grp_rev"));
  var left={T:0,Y:0,M:0}; S.pool.forEach(function(w){ if(w.src==="matematik") left.M++; else if(isNew(w)) left.Y++; else left.T++; });
  $("revCount").innerHTML="<b>"+esc(grp)+"</b> · "+esc(t("rev_left",left.T,left.Y,left.M))+"<br><span style='font-size:12px'>"+esc(limitLine())+"</span>";
  $("revWord").textContent=S.cur.word;
  $("revSen").innerHTML=S.cur.sen?esc(S.cur.sen):"<span style='opacity:.5'>"+esc(t("no_sen"))+"</span>";
  $("revMean").textContent=meanOf(S.cur)||"—";
  $("revMean").classList.add("hide"); $("revShow").classList.remove("hide"); $("revGrade").classList.add("hide");
}
function revealCard(){ $("revMean").classList.remove("hide"); $("revShow").classList.add("hide"); $("revGrade").classList.remove("hide"); }
var KNOWN_STEPS=[3,8,21,45,90], VERY_STEPS=[14,45,120,240];
function gradeCard(lvl){
  var w=S.cur; if(!w) return;
  var td=todayStr();
  if(w.seenDate!==td){ w.seenDate=td; w.seenCount=0; }
  w.seenCount++; if(!w.firstSeen) w.firstSeen=td;
  w.reps=(w.reps||0)+1; w.lvl=lvl; w.last=td;
  var leaves=true;
  if(lvl===3){ w.vstep=(w.vstep||0)+1; w.step=0; w.due=addDays(td,VERY_STEPS[Math.min(w.vstep-1,VERY_STEPS.length-1)]); }
  else if(lvl===2){ w.step=(w.step||0)+1; w.vstep=0; w.due=addDays(td,KNOWN_STEPS[Math.min(w.step-1,KNOWN_STEPS.length-1)]); }
  else if(lvl===1){ w.step=0; w.vstep=0; w.due=addDays(td,1); }
  else { w.step=0; w.vstep=0; if(w.seenCount>=2) w.due=addDays(td,2); else { w.due=td; leaves=false; } }
  w.upd=nowMs(); S.lastSid=w.sid=w.sid||slug(w.word);
  S.pool.shift(); if(leaves) S.done++;
  if(!S.tasks[td]) S.tasks[td]={}; S.tasks[td].kelime=true;
  sPut("words",w).then(function(){ return setKV("tasks",S.tasks); }).then(function(){ nextCard(); renderToday(); renderWords(); });
}

  var td=todayStr(), d=w.due||td; if(d<=td) return t("today_l");
  var n=daysBetween(td,d); return n===1?t("tomorrow"):t("in_days",n);
}

/* ---------- gramer antrenmanı / grammar training ---------- */
var GINT=[1,2,5,12,30,60];
var G=null;
function gRule(id){ for(var i=0;i<GRAM.length;i++) if(GRAM[i].id===id) return GRAM[i]; return null; }
function gQueue(){
  var td=todayStr(), g=S.gram, q=[], newToday=0, i, st;
  for(i=0;i<GRAM.length;i++){ st=g[GRAM[i].id]; if(st&&st.first===td) newToday++; }
  for(i=0;i<GRAM.length;i++){ st=g[GRAM[i].id]; if(st && st.due<=td && st.first!==td) q.push({rid:GRAM[i].id,type:"rev"}); }
  if(newToday<1) for(i=0;i<GRAM.length;i++) if(!g[GRAM[i].id]){ q.unshift({rid:GRAM[i].id,type:"new"}); break; }
  return q;
}
function gShuf(n){ var a=[],i,j,x; for(i=0;i<n;i++) a.push(i); for(i=n-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); x=a[i]; a[i]=a[j]; a[j]=x; } return a; }
function gSave(){ return setKV("gram",S.gram); }
function gStart(mode){
  var items=[];
  if(mode==="mix"){
    var pool=[]; GRAM.forEach(function(r){ if(S.gram[r.id]) r.q.forEach(function(q,k){ pool.push({rid:r.id,k:k}); }); });
    gShuf(pool.length).slice(0,6).forEach(function(i){ items.push({rid:pool[i].rid,k:pool[i].k,mix:true}); });

/* ---------- sesli + animasyonlu anlatım / narrated animation ----------
   Türkçe anlatımda {…} içindeki İngilizce kısımlar İngilizce sesle okunur. */
var GP=null, GP_RATE=1, GP_MUTE=false;
function gpVoices(){
  var v=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
  function pick(p){ var best=null,bs=-1; v.forEach(function(x){ if(x.lang&&x.lang.replace("_","-").toLowerCase().indexOf(p)===0){
    var n=x.name||"", sc=/Natural/i.test(n)?3:/Online|Google|Neural|Premium|Enhanced/i.test(n)?2:1; if(sc>bs){bs=sc;best=x;} } }); return best; }
  return {tr:pick("tr"), en:pick("en-us")||pick("en")};
}
function gpStop(){ if(GP){ GP.tok++; GP.playing=false; } try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){} }
function gpSay(list,cb){
  var tok=GP.tok, i=0, V=gpVoices();
  function next(){
    if(!GP||GP.tok!==tok) return;
    if(i>=list.length){ cb(); return; }
    var it=list[i++], done=false, tm;
    function fin(){ if(done) return; done=true; clearTimeout(tm); setTimeout(next,it.tight?40:250); }
    var est=Math.max(it.tight?500:1400,it.t.length*70/GP_RATE);
    if(GP_MUTE||!window.speechSynthesis||!window.SpeechSynthesisUtterance){ tm=setTimeout(fin,est); return; }
    var u=new SpeechSynthesisUtterance(it.t);
    u.lang=it.l==="en"?"en-US":"tr-TR"; var vv=it.l==="en"?V.en:V.tr; if(vv) u.voice=vv;
    u.rate=(it.l==="en"?0.92:1)*GP_RATE; u.onend=fin; u.onerror=fin;
    tm=setTimeout(fin,est*2.2+3000);
    try{ speechSynthesis.speak(u); }catch(e){ fin(); }
  }
  next();
}
function gpSplit(s){
  if(LANG!=="tr") return [{t:s,l:"en"}];
  var out=[], re=/\{([^}]*)\}/g, last=0, m;
  while((m=re.exec(s))){ var a=s.slice(last,m.index).trim(); if(a) out.push({t:a,l:"tr",tight:true});
    out.push({t:m[1].replace(/\bi n g\b/g,"ing"),l:"en",tight:true}); last=re.lastIndex; }
  var z=s.slice(last).trim(); if(z) out.push({t:z,l:"tr",tight:true});
  if(out.length) out[out.length-1].tight=false;
  return out;
}
function gpCap(s){ return esc(s).replace(/\{([^}]*)\}/g,function(_,x){ return '<i class="gen">'+x.replace(/\bi n g\b/g,"-ing")+'</i>'; }); }
function gpTxt(parts){ return parts.map(function(p){return p[0];}).join(""); }
function gpSent(parts,mode){
  return parts.map(function(p){
    var tag=p[1], cls="";
    if(mode>=1 && /[ABC]/.test(tag)) cls="g"+tag;
    if(tag==="X") cls=mode>=2?"gX on":"";
    if(tag==="F") cls="gF on";
    var tx=esc(p[0]); if(tag==="X" && !p[0]) tx=mode>=2?'<span class="gcar">^</span>':"";
    return '<span class="'+cls+'">'+tx+'</span>';
  }).join("");
}
function gpDraw(){
  var el=$("gPlayer"); if(!el||!GP) return;
  var a=GANIM[GP.rid], s=GP.step, lab="", labs=L(a.lab), nar=L(a.n);
  var parts=s>=3?a.ok:a.bad, mode=s>=3?3:s;
  if(s>=1) ["A","B","C"].forEach(function(k){ if(labs[k]) lab+='<span class="glab g'+k+'">'+esc(labs[k])+'</span>'; });
  var cap=s===0?t("gp_look"):nar[s-1];
  var badge=s===2?'<div class="gbad">'+esc(t("gp_wrong"))+'</div>':s>=3?'<div class="gok">'+esc(t("gp_right"))+'</div>':'';
  var dots=""; for(var i=0;i<5;i++) dots+='<i class="'+(i===s?'on':'')+'"></i>';
  el.innerHTML='<div class="gstage">'+badge+'<div class="gsent" lang="en">'+gpSent(parts,mode)+'</div>'+
    (lab?'<div class="glabs">'+lab+'</div>':'')+
    (s===4?'<div class="gsum" lang="en"><div class="gx bad">✗ '+esc(gpTxt(a.bad))+'</div><div class="gx ok">✓ '+esc(gpTxt(a.ok))+'</div></div>':'')+
    '</div><div class="gcap">'+gpCap(cap)+'</div>'+
    '<div class="gctl"><button class="sm" onclick="gpGo(-1)" aria-label="back">◀</button>'+
    '<button class="sm primary" onclick="gpToggle()">'+esc(GP.playing?t("gp_pause"):(s===4&&GP.ended?t("gp_replay"):t("gp_play")))+'</button>'+
    '<button class="sm" onclick="gpGo(1)" aria-label="next">▶</button>'+
    '<button class="sm ghost" onclick="gpRate()">'+esc(GP_RATE<1?t("gp_slow"):t("gp_norm"))+'</button>'+
    '<button class="sm ghost" onclick="gpMute()">'+(GP_MUTE?'🔇':'🔊')+'</button></div><div class="gdots">'+dots+'</div>';
}
function gpLines(s){
  var a=GANIM[GP.rid], nar=L(a.n);
  if(s===0) return [{t:t("gp_look"),l:LANG==="tr"?"tr":"en"},{t:gpTxt(a.bad),l:"en"}];
  if(s===3) return gpSplit(nar[2]).concat([{t:gpTxt(a.ok),l:"en"}]);
  return gpSplit(nar[s-1]);
}
function gpRun(){
  if(!GP) return; GP.tok++; GP.playing=true; GP.ended=false; gpDraw();
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  gpSay(gpLines(GP.step),function(){
    if(!GP) return;
    if(GP.step<4){ GP.step++; gpRun(); } else { GP.playing=false; GP.ended=true; gpDraw(); }
  });
}
function gpOpen(rid){ if(!GANIM[rid]) return; gpStop(); GP={rid:rid,step:0,playing:false,tok:0,ended:false}; gpRun(); }
function gpToggle(){ if(!GP) return; if(GP.playing){ gpStop(); gpDraw(); } else { if(GP.ended&&GP.step===4) GP.step=0; gpRun(); } }
function gpGo(d){ if(!GP) return; var p=GP.playing; gpStop(); GP.step=Math.max(0,Math.min(4,GP.step+d)); if(p) gpRun(); else gpDraw(); }
function gpRate(){ GP_RATE=GP_RATE<1?1:0.8; if(GP&&GP.playing){ gpStop(); gpRun(); } else gpDraw(); }
function gpMute(){ GP_MUTE=!GP_MUTE; if(GP&&GP.playing){ gpStop(); gpRun(); } else gpDraw(); }

  var fr=new FileReader();
  fr.onload=function(){
    var d; try{ d=JSON.parse(fr.result); }catch(e){ alert(t("s_imp_bad")); return; }
    if(!d||!d.kv||!d.kv.prof){ alert(t("s_imp_bad")); return; }
    if(!confirm(t("s_imp_q"))) return;
    wipe().then(function(){
      var p=[];
      (d.words||[]).forEach(function(w){ delete w.id; p.push(sPut("words",w)); });
      (d.errors||[]).forEach(function(e){ delete e.id; p.push(sPut("errors",e)); });
      (d.tests||[]).forEach(function(x){ delete x.id; p.push(sPut("tests",x)); });
      Object.keys(d.learned||{}).forEach(function(k){ p.push(sPut("learned",{id:k,v:d.learned[k]})); });
      Object.keys(d.kv).forEach(function(k){ if(KV_KEYS.indexOf(k)>=0 && d.kv[k]!=null) p.push(setKV(k,d.kv[k])); });
      return Promise.all(p);
    }).then(function(){ inp.value=""; return boot2(); }).then(function(){ alert(t("s_imp_ok")); });
  };
  fr.readAsText(f);
}
/* ---------- yükleme düğmesi, güncelleme, yedek hatırlatma / install, update, backup reminder ---------- */
var INST_EVT=null;
function isStandalone(){ return (window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true; }
function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1); }
window.addEventListener("beforeinstallprompt",function(e){ e.preventDefault(); INST_EVT=e; renderInstall(); });
window.addEventListener("appinstalled",function(){ INST_EVT=null; renderInstall(); });
function renderInstall(){
  var c=$("instCard"); if(!c||!S.prof) return;
  var hidden=false; try{ hidden=localStorage.getItem("instHide")===todayStr().slice(0,7); }catch(e){}
  var show=!isStandalone() && !hidden && (INST_EVT || isIOS());
  c.classList.toggle("hide",!show);
  if(!show) return;
  $("instText").textContent=INST_EVT?t("inst_android"):t("inst_ios");
  $("instBtn").classList.toggle("hide",!INST_EVT);
}
function doInstall(){ if(!INST_EVT) return; INST_EVT.prompt(); INST_EVT.userChoice.then(function(){ INST_EVT=null; renderInstall(); }); }
function hideInstall(){ try{ localStorage.setItem("instHide",todayStr().slice(0,7)); }catch(e){} renderInstall(); }  /* bir ay sorma */
function renderBackup(){
  var c=$("bkCard"); if(!c||!S.prof) return;
  getKV("lastBackup",null).then(function(lb){
    var ref=lb||S.prof.start, due=daysBetween(ref,todayStr())>=14 && (S.words.length>=15||S.errors.length>=5||S.tests.length>=2);
    getKV("bkSnooze",null).then(function(sn){
      var show=due && !(sn && daysBetween(sn,todayStr())<3);
      c.classList.toggle("hide",!show);
      if(show) $("bkText").textContent=t("bk_text",lb?fmtDate(lb):t("bk_never"));
    });
  });
}
function snoozeBackup(){ setKV("bkSnooze",todayStr()).then(renderBackup); }
function initUpdates(){
  if(!("serviceWorker" in navigator)) return;
  var had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",function(){ if(had) $("updToast").classList.remove("hide"); });
}

function resetAll(){ if(!confirm(t("s_reset_q"))) return; wipe().then(function(){ location.reload(); }); }

/* ---------- ilk kurulum / onboarding ---------- */
var OB={step:0,lang:null,exam:null,esl:true,cur:null,noScore:false,target:null,mins:60,err:""};
function obSteps(){ return OB.lang==="en"?["lang","exam","esl","score","target","mins","sum"]:["lang","exam","score","target","mins","sum"]; }
function obShow(){ $("ob").classList.remove("hide"); obDraw(); }
function obBtn(label,sub,on,fn){ return '<button class="'+(on?'on':'')+'" onclick="'+fn+'">'+esc(label)+(sub?'<small>'+esc(sub)+'</small>':'')+'</button>'; }
function obDraw(){
  var st=obSteps(), k=st[OB.step], h="";
  if(OB.lang){ LANG=OB.lang; }
  var dots='<div class="dots">'+st.map(function(_,i){return '<i class="'+(i<=OB.step?'on':'')+'"></i>';}).join("")+'</div>';
  h+='<h1>'+esc(APP_NAME)+'</h1><p class="muted" style="margin:0">'+esc(OB.lang?t("ob_welcome"):"Ücretsiz SAT programı · A free SAT study plan")+'</p>'+dots;
  if(k==="lang"){
    h+='<h2>Dil seç · Choose a language</h2><div class="big">'+obBtn("Türkçe","",OB.lang==="tr","obLang('tr')")+obBtn("English","",OB.lang==="en","obLang('en')")+'</div>';
    h+='<p style="margin-top:22px"><button class="ghost sm" onclick="document.getElementById(\'impFile\').click()">Yedekten yükle · Restore a backup</button></p>';
  } else if(k==="exam"){
    var dates=SAT_DATES.filter(function(d){return daysBetween(todayStr(),d)>=14;}).slice(0,6);
    h+='<h2>'+esc(t("ob_exam"))+'</h2><p class="muted">'+esc(t("ob_exam_hint"))+'</p><div class="big">'+
      dates.map(function(d){ return obBtn(fmtDate(d),"SAT · "+t("in_days",daysBetween(todayStr(),d)),OB.exam===d,"obExam('"+d+"')"); }).join("")+'</div>'+
      '<label>'+esc(t("ob_other"))+'</label><input type="date" id="obDate" value="'+(OB.exam&&dates.indexOf(OB.exam)<0?OB.exam:"")+'" onchange="obExam(this.value)">'+
      '<div class="big">'+obBtn(t("ob_unknown"),"",false,"obExamUnknown()")+'</div>';
  } else if(k==="esl"){
    h+='<h2>'+esc(t("ob_esl"))+'</h2><div class="big">'+obBtn(t("ob_yes"),"",OB.esl===false,"obEsl(false)")+obBtn(t("ob_no"),"",OB.esl===true,"obEsl(true)")+'</div>';
  } else if(k==="score"){
    h+='<h2>'+esc(t("ob_score"))+'</h2><p class="muted">'+esc(t("ob_score_hint"))+'</p>'+
      '<input id="obScore" type="number" inputmode="numeric" min="400" max="1600" step="10" placeholder="1100" value="'+(OB.cur||"")+'" oninput="OB.cur=parseInt(this.value,10)||null;OB.noScore=false">'+
      '<div class="big">'+obBtn(t("ob_noscore"),"",OB.noScore,"obNoScore()")+'</div>';
  } else if(k==="target"){
    var base=OB.cur||0, opts=[1200,1300,1400,1450,1500,1550,1600].filter(function(v){return v>base;});
    h+='<h2>'+esc(t("ob_target"))+'</h2><div class="chips" style="margin-top:10px">'+opts.map(function(v){
      return '<button class="chip" aria-pressed="'+(OB.target===v)+'" onclick="OB.target='+v+';OB.err=\'\';obDraw()">'+v+'</button>'; }).join("")+'</div>';
  } else if(k==="mins"){
    h+='<h2>'+esc(t("ob_mins"))+'</h2><p class="muted">'+esc(t("ob_mins_hint"))+'</p><div class="big">'+
      [30,60,90].map(function(v){ return obBtn(t("ob_min",v),"",OB.mins===v,"OB.mins="+v+";obDraw()"); }).join("")+'</div>';
  } else if(k==="sum"){
    var tmp=obProfile(), keep=S.prof; S.prof=tmp; _td=null;
    var pd=planDates(), tdays=testDays(), nm=t("ph_names"), ds=t("ph_desc"), lis="";
    if(pd.hacim>tmp.start) lis+='<li><b>'+esc(nm[0])+'</b> — '+esc(t("ph_until",fmtDate(addDays(pd.hacim,-1))))+': '+esc(ds[0])+'</li>';
    if(pd.prova>pd.hacim) lis+='<li><b>'+esc(nm[1])+'</b> — '+esc(t("ph_until",fmtDate(addDays(pd.prova,-1))))+': '+esc(ds[1])+'</li>';
    lis+='<li><b>'+esc(nm[2])+'</b> — '+esc(t("ph_exam"))+': '+esc(ds[2])+'</li>';
    h+='<h2>'+esc(t("ob_plan"))+'</h2><div class="card sum"><p>'+esc(t("ob_sum1",daysBetween(tmp.start,tmp.exam),fmtDate(tmp.exam)))+'</p>'+
      '<p>'+esc(tmp.cur?t("ob_sum2",tmp.cur,tmp.target):t("ob_sum2b",tmp.target))+'</p>'+
      '<p style="margin-bottom:0">'+esc(t("ob_sum3"))+'</p><ul style="margin-top:4px;padding-left:20px">'+lis+'</ul>'+
      (tdays.length?'<p>'+esc(t("ob_sum4",fmtDate(tdays[0])))+'</p>':'')+'</div>';
    S.prof=keep; _td=null;
  }
  h+='<div class="err">'+esc(OB.err)+'</div><div class="obnav">'+
    (OB.step>0?'<button onclick="obBack()">'+esc(t("ob_back"))+'</button>':'')+
    (k!=="lang"?'<button class="primary" onclick="obNext()">'+esc(k==="sum"?t("ob_start"):t("ob_next"))+'</button>':'')+'</div>';
  $("obBox").innerHTML=h;
}
function obLang(l){ OB.lang=l; LANG=l; if(l==="tr") OB.esl=true; OB.step=1; OB.err=""; applyI18n(); obDraw(); }
function obExam(d){ if(!d) return; if(daysBetween(todayStr(),d)<1){ OB.err=t("ob_bad_date"); obDraw(); return; } OB.exam=d; OB.err=""; obDraw(); }
function obExamUnknown(){ var d=SAT_DATES.filter(function(x){return daysBetween(todayStr(),x)>=90;})[0]||addDays(todayStr(),120); OB.exam=d; OB.err=""; obNext(); }
function obEsl(v){ OB.esl=v; obNext(); }
function obNoScore(){ OB.noScore=true; OB.cur=null; OB.err=""; obNext(); }
function obBack(){ OB.err=""; OB.step=Math.max(0,OB.step-1); obDraw(); }
function obNext(){
  var k=obSteps()[OB.step]; OB.err="";
  if(k==="exam" && !OB.exam){ OB.err=t("ob_bad_date"); return obDraw(); }
  if(k==="score" && !OB.noScore){ var v=OB.cur; if(!v||v<400||v>1600){ OB.err=t("ob_bad_score"); return obDraw(); } }
  if(k==="target"){ if(!OB.target){ OB.err=t("ob_target"); return obDraw(); } if(OB.cur && OB.target<=OB.cur){ OB.err=t("ob_bad_target"); return obDraw(); } }
  if(k==="sum") return obFinish();
  OB.step++; obDraw();
}
function obProfile(){ return {lang:OB.lang,exam:OB.exam,start:todayStr(),cur:OB.noScore?null:OB.cur,target:OB.target,mins:OB.mins,esl:OB.lang==="tr"?true:OB.esl}; }
function obFinish(){
  S.prof=obProfile(); _td=null;
  S.mathDrip=!!S.prof.esl;
  var p=[saveProf(),setKV("mathDrip",S.mathDrip)];
  if(S.prof.cur) p.push(sPut("tests",{date:todayStr(),name:t("p_start"),rw:null,math:null,total:S.prof.cur}));
  Promise.all(p).then(function(){ $("ob").classList.add("hide"); return boot2(); });
}

/* ---------- yükleme / load ---------- */
function load(){
  return Promise.all([sAll("words"),sAll("errors"),sAll("tests"),sAll("learned"),getKV("tasks",{}),getKV("inbox",[]),getKV("qlog",[]),
    getKV("roots",[]),getKV("gram",{}),getKV("theme",""),getKV("showTr",false),getKV("revLimit",100),getKV("newLimit",10),getKV("mathDrip",true)])
  .then(function(r){
    S.words=r[0]; S.errors=r[1]; S.tests=r[2]; S.learned={}; r[3].forEach(function(x){ S.learned[x.id]=x.v; });
    S.tasks=r[4]||{}; S.inbox=r[5]||[]; S.qlog=r[6]||[]; S.roots=r[7]||[]; S.gram=r[8]||{}; S.theme=r[9]||"";
    S.showTr=!!r[10]; S.revLimit=r[11]||100; S.newLimit=r[12]||10; S.mathDrip=r[13]!==false;
    applyTheme(); renderAll();
    if(!S.cur) startReview();
  });
}
function renderAll(){
  applyI18n();
  $("tDate").value=todayStr();
  $("btnTureng").classList.toggle("hide",LANG!=="tr");
  renderToday(); renderWords(); renderChips(); renderErrors(); renderLearn(); renderProgress();
  renderSettings(); renderMath(); renderNotes(); renderQlog(); renderRoots(); renderGram();
  renderInstall(); renderBackup();
}
function boot2(){
  return getKV("prof",null).then(function(p){
    if(!p){ LANG=(navigator.language||"").toLowerCase().indexOf("tr")===0?"tr":"en"; applyI18n(); obShow(); return; }
    $("ob").classList.add("hide");
    S.prof=p; LANG=p.lang||"en"; _td=null; DRIPPED=false;
    return load().then(function(){ go("bugun"); dripPack(); });
  });
}
function boot(){
  openDB().then(function(){
    if(MEM) $("memWarn").classList.remove("hide");
    return boot2();
  });
  if("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && window.self===window.top){
    try{ initUpdates(); navigator.serviceWorker.register("sw.js").catch(function(){}); }catch(e){}
  }
}
var LAST_DAY=null;
function checkDayRoll(){
  if(!S.prof) return;
  var d=todayStr(); if(LAST_DAY===null){ LAST_DAY=d; return; } if(d===LAST_DAY) return;
  LAST_DAY=d; S.cur=null; DRIPPED=false; load().then(dripPack);
}
setInterval(checkDayRoll,60000);
document.addEventListener("visibilitychange",function(){ if(!document.hidden) checkDayRoll(); });
boot();

</script>
