<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scorepath</title>
<meta name="description" content="A free daily SAT study plan: vocabulary, grammar lessons with narration, question log and progress tracking. Türkçe ve English.">

<meta property="og:description" content="Daily plan, narrated grammar lessons, vocabulary and progress tracking. Free, no account. Türkçe / English.">

<style>

:root{
  --bg:#f5f6f8; --card:#ffffff; --line:#e2e5ea; --fg:#141821; --dim:#666e7d;
  --acc:#2255c8; --acc-fg:#ffffff; --ok:#1d8a4e; --warn:#b8860b; --bad:#c0392b;
  --c-bilgi:#c0392b; --c-dil:#b8860b; --c-teknik:#2255c8; --c-dikkat:#7a4fb5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b0e14; --card:#151a23; --line:#262d3a; --fg:#e8ecf3; --dim:#8c95a6;
    --acc:#4a86ff; --acc-fg:#08101f; --ok:#3ecf7a; --warn:#e0b341; --bad:#ff6b5b;
    --c-bilgi:#ff6b5b; --c-dil:#e0b341; --c-teknik:#4a86ff; --c-dikkat:#b18cff;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0e14; --card:#151a23; --line:#262d3a; --fg:#e8ecf3; --dim:#8c95a6;
  --acc:#4a86ff; --acc-fg:#08101f; --ok:#3ecf7a; --warn:#e0b341; --bad:#ff6b5b;
  --c-bilgi:#ff6b5b; --c-dil:#e0b341; --c-teknik:#4a86ff; --c-dikkat:#b18cff;
}
:root[data-theme="amoled"]{
  --bg:#000000; --card:#0a0a0a; --line:#1e1e1e; --fg:#ededed; --dim:#8a8a8a;
  --acc:#4a86ff; --acc-fg:#000000; --ok:#3ecf7a; --warn:#e0b341; --bad:#ff6b5b;
  --c-bilgi:#ff6b5b; --c-dil:#e0b341; --c-teknik:#4a86ff; --c-dikkat:#b18cff;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
  padding-bottom:78px;
}
header{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:var(--card); border-bottom:1px solid var(--line);
  padding:10px 14px; display:flex; align-items:center; gap:10px;
}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.2px}
header .sub{font-size:12px;color:var(--dim);margin-left:auto;text-align:right;line-height:1.25}
#gPill{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;
  padding:4px 9px;font:inherit;line-height:1.15;text-align:center;cursor:pointer;min-width:62px}
#gPill b{display:block;font-size:14px}
#gPill span{display:block;font-size:10.5px;font-weight:700}
#gPanel{position:fixed;right:10px;left:10px;top:58px;z-index:30;max-width:420px;margin-left:auto;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13.5px;line-height:1.5}
#gPanel h3{margin:0 0 4px;font-size:14px}
#gPanel .gr{display:block;padding:8px 0;border-top:1px solid var(--line)}
#gPanel .gr:first-child{border-top:0;padding-top:0}
#gPanel .big{font-size:20px;font-weight:800}
#gPanel .muted{color:var(--dim);font-size:12.5px}
.mrow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.mrow .mtr{color:var(--dim);text-align:right}
.mtag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--ok);border:1px solid var(--ok);border-radius:6px;padding:0 5px;margin-left:4px;white-space:nowrap}
.mrow .mex{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--acc)}
details.card summary{cursor:pointer;list-style:none}
.seg{display:flex;gap:0;margin-bottom:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{flex:1;border:0;border-radius:0;background:transparent;padding:10px;font-weight:700;color:var(--dim)}
.seg button.on{background:var(--acc);color:var(--acc-fg)}
.root{border-top:1px solid var(--line);padding:10px 0}
.root .rh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.root .rh b{font-size:17px}
.root .ro{font-size:12px;color:var(--dim)}
.root .dv{display:flex;justify-content:space-between;gap:8px;padding:5px 0 5px 12px;border-left:3px solid var(--acc);margin-top:5px;font-size:14px}
.root .dv span{color:var(--dim);text-align:right}
.root .add{display:flex;gap:6px;margin-top:8px}
.root .add input{padding:7px 9px;font-size:14px}
#noteFab{position:fixed;right:14px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:31;
  width:50px;height:50px;border-radius:25px;border:0;background:var(--acc);color:var(--acc-fg);
  font-size:22px;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;padding:0}
#noteFab i{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);
  color:#fff;font-size:11px;font-style:normal;font-weight:700;line-height:18px;padding:0 4px}
#notePanel{position:fixed;left:10px;right:10px;bottom:calc(132px + env(safe-area-inset-bottom,0px));top:64px;z-index:32;
  max-width:460px;margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.nsrc{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.nsrc button{font-size:12.5px;padding:5px 10px}
.nsrc button.on,#noteFilter button.on{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
.nitem{border-top:1px solid var(--line);padding:9px 0}
.nitem .nt{white-space:pre-wrap;font-size:14px}
.nitem .nm{font-size:11.5px;color:var(--dim);margin-top:2px}
.nitem.done .nt{opacity:.55}
main{padding:14px 14px 70px;max-width:760px;margin:0 auto}
section{display:none}
section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.gstage{position:relative;border:1px solid var(--line);border-radius:12px;padding:18px 14px 14px;background:var(--bg);min-height:120px}
.gsent{font-size:19px;line-height:1.9}
.gsent span{transition:background .4s,color .4s;border-radius:5px}
.gA{background:color-mix(in srgb,#2f7cf6 22%,transparent);box-shadow:inset 0 -3px 0 #2f7cf6}
.gB{background:color-mix(in srgb,#9b5de5 22%,transparent);box-shadow:inset 0 -3px 0 #9b5de5}
.gC{background:color-mix(in srgb,#e09a24 24%,transparent);box-shadow:inset 0 -3px 0 #e09a24}
.gX.on{color:#fff;background:var(--bad);padding:0 3px;display:inline-block;animation:gshake .5s 2}
.gF.on{color:#fff;background:var(--ok);padding:0 3px;display:inline-block;animation:gpop .6s}
.gcar{font-weight:800}
@keyframes gshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes gpop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
.glabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;animation:gfade .5s}
.glab{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px}
.gbad,.gok{position:absolute;top:-10px;right:10px;font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;color:#fff;background:var(--bad);animation:gpop .4s}
.gok{background:var(--ok)}
.gsum{margin-top:10px;animation:gfade .5s}
.gen{font-style:normal;font-weight:700;color:var(--acc)}
.gcap{margin:10px 0 4px;font-size:15px;line-height:1.5;min-height:46px;animation:gfade .4s}
@keyframes gfade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.gctl{display:flex;gap:6px;flex-wrap:wrap}.gctl button{flex:0 0 auto}
.gdots{display:flex;gap:5px;justify-content:center;margin-top:8px}.gdots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.gdots i.on{background:var(--acc)}
@media (prefers-reduced-motion:reduce){.gX.on,.gF.on,.glabs,.gcap,.gsum,.gbad,.gok{animation:none}}
.gl{border-left:3px solid var(--acc);padding:4px 0 4px 12px}
.gt{font-weight:700;font-size:16px;margin-bottom:4px}
.gx{font-size:14px;padding:6px 10px;border-radius:8px;margin-top:6px;font-style:italic}
.gx.ok{border:1px solid var(--ok)}.gx.bad{border:1px solid var(--bad);text-decoration:line-through;text-decoration-color:var(--bad)}
.gq{font-size:16px;line-height:1.5;margin:6px 0 10px}.gb{color:var(--acc);font-weight:700}
.gopts{display:flex;flex-direction:column;gap:6px}.gopt{text-align:left}
.gopt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}
.gopt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,transparent)}
.gwhy{margin-top:10px;font-size:14px;padding:8px 10px;border-radius:8px;border:1px solid var(--line)}
.gwhy.ok{border-color:var(--ok)}.gwhy.bad{border-color:var(--bad)}
.grow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.card h2{font-size:15px;margin:0 0 10px;font-weight:700}
.card h3{font-size:13px;margin:14px 0 8px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
p.muted{color:var(--dim);font-size:13px;margin:6px 0}
label{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px;font-weight:600}
input,select,textarea{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--fg);font:inherit;font-size:15px;min-height:44px
}
textarea{min-height:68px;resize:vertical}
button{
  font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--fg);
  padding:11px 14px;border-radius:10px;min-height:44px;cursor:pointer
}
button.primary{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
button.ghost{background:transparent}
button.sm{padding:7px 10px;min-height:36px;font-size:13px}
button:active{transform:translateY(1px)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{
  padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;
  font-size:13px;min-height:38px;color:var(--fg)
}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
nav button{
  flex:1;border:0;border-radius:0;background:transparent;padding:9px 2px 8px;
  font-size:11px;font-weight:600;color:var(--dim);min-height:56px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:3px
}
nav button .ic{font-size:19px;line-height:1}
nav button[aria-current="true"]{color:var(--acc)}
.task{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .box{
  width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:15px;color:transparent
}
.task.done .box{background:var(--ok);border-color:var(--ok);color:#fff}
.task.done .t{text-decoration:line-through;color:var(--dim)}
.task .t{flex:1;font-size:14.5px}
.task .t small{display:block;color:var(--dim);font-size:12px;text-decoration:none}
.stat{display:flex;gap:8px;flex-wrap:wrap}
.stat>div{flex:1;min-width:66px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 8px}
.stat b{display:block;font-size:21px;line-height:1.15}
.stat span{font-size:11px;color:var(--dim)}
.item{border-bottom:1px solid var(--line);padding:11px 0}
.item:last-child{border-bottom:0}
.item .hd{display:flex;gap:8px;align-items:baseline}
.item .hd b{font-size:15px}
.item .hd .tag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.item .sen{font-size:13.5px;color:var(--dim);font-style:italic;margin-top:4px;white-space:pre-wrap}
.item .mn{font-size:14px;margin-top:4px;white-space:pre-wrap}
.cat{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff}
.cat.bilgi{background:var(--c-bilgi)} .cat.dil{background:var(--c-dil)}
.cat.teknik{background:var(--c-teknik)} .cat.dikkat{background:var(--c-dikkat)}
.bar{height:9px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;background:var(--acc)}
.rev{text-align:center;padding:8px 0}
.rev .w{font-size:30px;font-weight:800;letter-spacing:-.5px;margin:10px 0}
.rev .s{font-size:14.5px;color:var(--dim);font-style:italic;margin:10px 0;line-height:1.55;white-space:pre-wrap}
.rev .m{font-size:19px;font-weight:600;margin:12px 0;color:var(--ok);white-space:pre-wrap}
details{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--bg)}
details summary{cursor:pointer;font-weight:600;font-size:14.5px;list-style:none;display:flex;gap:8px;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary .dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:0 0 auto}
details.learned summary .dot{background:var(--ok)}
details .bd{font-size:14px;color:var(--fg);margin-top:9px;line-height:1.6}
details .bd code{background:var(--card);padding:1px 5px;border-radius:5px;font-size:13px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.warn{background:var(--bg);border:1px solid var(--warn);border-radius:10px;padding:10px;font-size:13px;margin-bottom:12px}
.hide{display:none!important}
#revGrade.hide{display:none!important}
.dup{background:var(--bg);border:1px solid var(--warn);border-radius:10px;padding:10px;margin-top:10px;font-size:13.5px;white-space:pre-wrap}
.lvl{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.trbox{margin-top:9px;padding:9px 11px;border-left:3px solid var(--acc);background:var(--card);border-radius:8px;font-size:13.5px;line-height:1.55}
a{color:var(--acc)}

/* onboarding */
#ob{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto;padding:max(24px,env(safe-area-inset-top)) 16px 32px}
#ob .obw{max-width:480px;margin:0 auto}
#ob h1{font-size:26px;margin:18px 0 4px;letter-spacing:-.4px}
#ob h2{font-size:19px;margin:22px 0 6px}
#ob .big{display:flex;flex-direction:column;gap:8px;margin-top:12px}
#ob .big button{text-align:left;padding:14px 16px;font-size:16px}
#ob .big button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--card))}
#ob .big button small{display:block;color:var(--dim);font-weight:500;font-size:12.5px}
#ob .obnav{display:flex;gap:8px;margin-top:22px}
#ob .obnav button{flex:1}
#ob .err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}
#ob .dots{display:flex;gap:5px;margin-top:6px}#ob .dots i{flex:1;height:4px;border-radius:2px;background:var(--line)}#ob .dots i.on{background:var(--acc)}
.sum li{margin:4px 0}
.tlink{font-size:12px;font-weight:600;margin-right:10px}
.about p{font-size:12.5px;color:var(--dim);margin:6px 0}

input,select,textarea,button{box-sizing:border-box}
.row>*{min-width:0}

#updToast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:40;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px 8px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25);
  display:flex;gap:10px;align-items:center;font-size:14px;white-space:nowrap}
#updToast.hide{display:none}

</style>
</head>
<body>
<header>
  <h1 id="appName"></h1>
  <div class="sub" id="hdrSub"></div>
  <button id="gPill" onclick="toggleGauge()"><b id="gScore">—</b><span id="gLbl">…</span></button>
</header>

<div id="gPanel" class="hide"></div>
<button id="noteFab" onclick="toggleNotes()">+<i id="noteCnt" class="hide">0</i></button>
<div id="notePanel" class="hide">
  <h2 style="margin:0 0 4px" data-i="inb_title"></h2>
  <p class="muted" style="margin:0" data-i="inb_hint"></p>
  <div style="display:flex;gap:8px;margin-top:8px">
    <input id="inbIn" data-ip="inb_ph" lang="en" spellcheck="true" autocapitalize="none" autocorrect="off" autocomplete="off"
      onkeydown="if(event.key==='Enter'){event.preventDefault();addInbox();}" onpaste="inbPaste(event)">
    <button onclick="addInbox()" style="flex:0 0 auto" data-i="add"></button>
  </div>
  <p class="muted" style="margin:6px 0 0;font-size:12px" data-i="inb_multi"></p>
  <button id="inbGo" onclick="processInbox()" style="width:100%;margin-top:10px"></button>
  <div id="noteList" style="margin-top:6px"></div>
</div>

<div id="updToast" class="hide"><span data-i="upd_ready"></span> <button class="sm primary" onclick="location.reload()" data-i="upd_btn"></button></div>
<div id="ob" class="hide"><div class="obw" id="obBox"></div></div>

<main>
<section id="s-bugun" class="on">
  <div id="memWarn" class="warn hide" data-i="mem_warn"></div>
  <div class="card hide" id="instCard">
    <h2 data-i="inst_title"></h2>
    <p class="muted" id="instText" style="margin:0 0 10px"></p>
    <div class="row"><button class="primary" id="instBtn" onclick="doInstall()" data-i="inst_btn"></button><button class="ghost" onclick="hideInstall()" data-i="inst_later"></button></div>
  </div>
  <div class="card hide" id="bkCard">
    <h2 data-i="bk_title"></h2>
    <p class="muted" id="bkText" style="margin:0 0 10px"></p>
    <div class="row"><button class="primary" onclick="exportData()" data-i="s_export"></button><button class="ghost" onclick="snoozeBackup()" data-i="inst_later"></button></div>
  </div>
  <div class="card">
    <h2 id="todayTitle"></h2>
    <p class="muted" id="nextUp" style="margin:0 0 10px"></p>
    <div class="stat">
      <div><b id="stStreak">0</b><span data-i="st_streak"></span></div>
      <div><b id="stDue">0</b><span data-i="st_due"></span></div>
      <div><b id="stWords">0</b><span data-i="st_words"></span></div>
      <div><b id="stDays">—</b><span data-i="st_days"></span></div>
    </div>
  </div>
  <div class="card">
    <h2><span data-i="h_tasks"></span> <span id="phaseLbl" class="muted" style="font-size:12.5px;font-weight:600"></span></h2>
    <div id="taskList"></div>
  </div>
  <div class="card">
    <h2 data-i="h_qlog"></h2>
    <p class="muted" style="margin:0 0 6px" data-i="qlog_hint"></p>
    <select id="qSk"></select>
    <div class="row" style="margin-top:8px">
      <div><label data-i="correct"></label><input id="qC" type="number" inputmode="numeric" min="0" placeholder="7"></div>
      <div><label data-i="total"></label><input id="qN" type="number" inputmode="numeric" min="1" placeholder="10"></div>
    </div>
    <button class="primary" style="width:100%;margin-top:10px" onclick="addQlog()" data-i="save"></button>

efore it."}}, {"s": "The research team included ___ chemist, a biologist, and a physicist.", "o": ["a", ": a", "; a", "— a"], "w": {"tr": "'included' yarım kalıyor (nesnesi yok) → iki nokta konmaz.", "en": "'included' is unfinished (it needs its object), so no colon."}}]}, {"id": "b4", "ok": "Some birds migrate; others stay all year.", "bad": "Because the soil was dry; the farmers waited.", "t": {"tr": "Noktalı virgül = nokta", "en": "A semicolon works like a period"}, "r": {"tr": "Noktalı virgülün iki tarafı da tam cümle olmalı. Yan cümleden (Because…, Although…) sonra noktalı virgül gelmez. İstisna: içinde virgül olan listelerde öğeleri ayırır.", "en": "Both sides of a semicolon must be complete sentences. A dependent clause (Because…, Although…) cannot be followed by a semicolon. Exception: in a list whose items already contain commas, semicolons separate the items."}, "q": [{"s": "Some birds migrate thousands of ___ stay in the same area all year.", "o": ["miles; others", "miles, others", "miles others", "miles: and others"], "w": {"tr": "İki tam cümle: noktalı virgül.", "en": "Two complete sentences: use a semicolon."}}, {"s": "Because the soil was ___ farmers delayed planting.", "o": ["dry, the", "dry; the", "dry. The", "dry: the"], "w": {"tr": "'Because…' yan cümle; tek başına cümle değil → virgül.", "en": "'Because…' is a dependent clause and cannot stand alone, so use a comma."}}, {"s": "The tour stops in Paris, ___ Rome, Italy; and Madrid, Spain.", "o": ["France;", "France,", "France:", "France"], "w": {"tr": "Öğelerin içinde virgül var → öğeleri noktalı virgülle ayır.", "en": "The items already contain commas, so separate them with semicolons."}}]}, {"id": "b5", "ok": "Kepler—who studied planets—was also an astrologer.", "bad": "Kepler—who studied planets, was also an astrologer.", "t": {"tr": "Ek bilgi çiftle açılır, çiftle kapanır", "en": "Extra information opens and closes with the same mark"}, "r": {"tr": "Cümleden çıkarılabilen ek bilgi iki virgül, iki tire ya da parantez arasına alınır. Hangisiyle açıldıysa onunla kapanmalı.", "en": "Information you could remove from the sentence goes between two commas, two dashes, or parentheses. Close it with the same mark you opened it with."}, "q": [{"s": "The coelacanth, a fish once thought to be ___ found alive in 1938.", "o": ["extinct, was", "extinct— was", "extinct was", "extinct; was"], "w": {"tr": "Virgülle açıldı → virgülle kapanır.", "en": "It opened with a comma, so it closes with a comma."}}, {"s": "Kepler—who studied planetary ___ also an astrologer.", "o": ["motion—was", "motion, was", "motion was", "motion; was"], "w": {"tr": "Tireyle açıldı → tireyle kapanır.", "en": "It opened with a dash, so it closes with a dash."}}, {"s": "The festival's main event (a parade through the old ___ at noon.", "o": ["town) starts", "town, starts", "town— starts", "town starts"], "w": {"tr": "Parantez açıldı → parantez kapanır.", "en": "It opened with a parenthesis, so it closes with one."}}]}, {"id": "b6", "ok": "The comedian Jemaine Clement voiced the crab.", "bad": "The comedian, Jemaine Clement, voiced the crab.", "t": {"tr": "Gerekli bilgi virgülsüz", "en": "Essential information takes no commas"}, "r": {"tr": "Kimden bahsedildiğini belirleyen bilgi virgül almaz: 'comedian Jemaine Clement', 'students who finish early', 'the painting that hangs…'.", "en": "Information that tells you WHICH person or thing you mean takes no commas: 'the comedian Jemaine Clement', 'students who finish early', 'the painting that hangs…'."}, "q": [{"s": "The Nigerian writer ___ the Nobel Prize in 1986.", "o": ["Wole Soyinka won", "Wole Soyinka, won", ", Wole Soyinka won", ", Wole Soyinka, won"], "w": {"tr": "İsim, 'writer'ın kim olduğunu belirliyor → virgül yok.", "en": "The name tells you which writer, so no commas."}}, {"s": "Students ___ the project early may present first.", "o": ["who finish", ", who finish", "who finish,", ", who finish,"], "w": {"tr": "Hangi öğrenciler? Bilgi gerekli → virgül yok.", "en": "Which students? The information is essential, so no commas."}}, {"s": "The painting ___ in the hallway was a gift.", "o": ["that hangs", ", that hangs", "that hangs,", ", that hangs,"], "w": {"tr": "'that' ile başlayan kısım her zaman gerekli bilgi → virgülsüz.", "en": "A clause starting with 'that' is always essential, so no commas."}}]}, {"id": "b7", "ok": "The scientists who studied the samples concluded that…", "bad": "The scientists who studied the samples, concluded that…", "t": {"tr": "Özne ile yüklem arasına noktalama girmez", "en": "No punctuation between subject and verb"}, "r": {"tr": "Özne ile yüklemin, yüklem ile nesnesinin arasına virgül, noktalı virgül, iki nokta ya da tire konmaz (çift virgüllü ek bilgi hariç).", "en": "Do not put a comma, semicolon, colon, or dash between a subject and its verb, or between a verb and its object (except a pair of commas around extra information)."}, "q": [{"s": "The scientists who studied the samples ___ that the rocks were volcanic.", "o": ["concluded", ", concluded", "; concluded", "— concluded"], "w": {"tr": "Özne uzun olsa da yüklemden ayrılmaz.", "en": "Even a long subject is not separated from its verb."}}, {"s": "The main goal of the program ___ to reduce waste.", "o": ["is", ", is", "—is", ": is"], "w": {"tr": "Özne + yüklem arası boş.", "en": "Nothing goes between the subject and the verb."}}, {"s": "The survey found ___ residents supported the plan.", "o": ["that most", "that, most", "that: most", ", that most"], "w": {"tr": "'found that…' nesne; araya noktalama girmez.", "en": "'found that…' is the object; no punctuation goes in between."}}]}, {"id": "b8", "ok": "They investigated how their use could be regulated.", "bad": "They investigated how could their use be regulated?", "t": {"tr": "Dolaylı soru = düz cümle", "en": "An indirect question is a statement"}, "r": {"tr": "'…asked how / wondered why / investigated whether…' ile başlayan soru, soru değildir: normal sırayla yazılır ve nokta ile biter.", "en": "A question reported after '…asked how / wondered why / investigated whether…' is not a real question: use normal word order and end with a period."}, "q": [{"s": "Researchers wanted to know why ___", "o": ["the lake was shrinking.", "was the lake shrinking?", "the lake was shrinking?", "was the lake shrinking."], "w": {"tr": "Dolaylı soru: özne + yüklem sırası, sonda nokta.", "en": "Indirect question: subject before verb, period at the end."}}, {"s": "The historian asked how ___", "o": ["the letters had survived.", "had the letters survived?", "the letters had survived?", "had the letters survived."], "w": {"tr": "Düz sıra + nokta.", "en": "Normal word order and a period."}}, {"s": "Engineers are studying whether ___", "o": ["the design can withstand earthquakes.", "can the design withstand earthquakes?", "the design can withstand earthquakes?", "can the design withstand earthquakes."], "w": {"tr": "'whether' ile gelen dolaylı soru: düz cümle.", "en": "An indirect question with 'whether' is a statement."}}]}, {"id": "b9", "ok": "After the storm passed, the crew repaired the roof.", "bad": "After the storm passed the crew repaired the roof.", "t": {"tr": "Girişteki yan cümleden sonra virgül", "en": "Comma after an opening clause"}, "r": {"tr": "Cümle 'After…, Although…, To…, Because…' gibi bir girişle başlıyorsa, giriş bitince virgül konur.", "en": "If the sentence opens with a phrase like 'After…, Although…, To…, Because…', put a comma where the opening ends."}, "q": [{"s": "After the storm ___ crew repaired the roof.", "o": ["passed, the", "passed the", "passed; the", "passed: the"], "w": {"tr": "Giriş bitti → virgül.", "en": "The opening phrase ends here, so add a comma."}}, {"s": "Although the plan was ___ council approved it.", "o": ["expensive, the", "expensive the", "expensive; the", "expensive. The"], "w": {"tr": "'Although…' yan cümle → virgül; nokta/noktalı virgül onu yalnız bırakır.", "en": "'Although…' is a dependent clause, so use a comma. A period or semicolon would leave it alone."}}, {"s": "To finish the bridge on ___ company hired extra workers.", "o": ["time, the", "time the", "time; the", "time: the"], "w": {"tr": "Giriş (To…) → virgül.", "en": "An opening 'To…' phrase is followed by a comma."}}]}, {"id": "b10", "ok": "The kit includes a map, a compass, and a whistle.", "bad": "The kit includes, a map, a compass, and a whistle.", "t": {"tr": "Listelerde virgül", "en": "Commas in a list"}, "r": {"tr": "Üç ve daha fazla öğe virgülle ayrılır; listenin ilk öğesinden önce virgül konmaz.", "en": "Separate three or more items with commas. Do not put a comma before the first item."}, "q": [{"s": "The kit includes a ___ compass, and a whistle.", "o": ["map, a", "map a", "map; a", "map: a"], "w": {"tr": "Liste öğeleri virgülle ayrılır.", "en": "List items are separated by commas."}}, {"s": "The garden grows ___", "o": ["corn, beans, and squash.", ", corn, beans, and squash.", "corn beans, and squash.", "corn, beans and, squash."], "w": {"tr": "İlk öğeden önce virgül yok; 'and'den sonra virgül yok.", "en": "No comma before the first item, and no comma right after 'and'."}}, {"s": "Volunteers planted ___ the river, and painted benches.", "o": ["trees, cleaned", "trees cleaned", "trees; cleaned", "trees: cleaned"], "w": {"tr": "Üç eylemli liste → virgül.", "en": "A list of three actions takes commas."}}]}, {"id": "f1", "ok": "The collection of ancient coins is displayed.", "bad": "The collection of ancient coins are displayed.", "t": {"tr": "Özne-yüklem uyumu: gerçek özneyi bul", "en": "Subject-verb agreement: find the real subject"}, "r": {"tr": "Yüklem, araya giren 'of the…' kısmına değil gerçek özneye uyar. 'The collection of coins IS', 'The results of the test SUPPORT'. 'Each' tekildir.", "en": "The verb agrees with the real subject, not with the 'of the…' phrase in between. 'The collection of coins IS', 'The results of the test SUPPORT'. 'Each' is singular."}, "q": [{"s": "The collection of ancient coins ___ displayed in the main hall.", "o": ["is", "are", "were", "have been"], "w": {"tr": "Özne 'collection' (tekil), 'coins' değil.", "en": "The subject is 'collection' (singular), not 'coins'."}}, {"s": "The results of the experiment ___ the hypothesis.", "o": ["support", "supports", "has supported", "is supporting"], "w": {"tr": "Özne 'results' (çoğul).", "en": "The subject is 'results' (plural)."}}, {"s": "Each of the paintings ___ a hidden signature.", "o": ["contains", "contain", "are containing", "have contained"], "w": {"tr": "'Each' her zaman tekil.", "en": "'Each' is always singular."}}]}, {"id": "f2", "ok": "Using public domain songs ensures that…", "bad": "Using public domain songs ensure that…", "t": {"tr": "-ing / to… ile başlayan özne tekildir", "en": "A subject that starts with -ing or to is singular"}, "r": {"tr": "'Reading letters', 'Using these songs', 'To build tunnels' gibi eylem öznesi tek bir şeydir → tekil yüklem (helps, ensures, was).", "en": "A subject like 'Reading letters', 'Using these songs', or 'To build tunnels' is one action, so it takes a singular verb (helps, ensures, was)."}, "q": [{"s": "Reading old letters ___ historians understand daily life.", "o": ["helps", "help", "have helped", "are helping"], "w": {"tr": "Özne 'Reading' (tek eylem) → tekil.", "en": "The subject 'Reading' is one action, so it is singular."}}, {"s": "Planting native flowers ___ bees and butterflies.", "o": ["attracts", "attract", "are attracting", "have attracted"], "w": {"tr": "-ing özne tekil.", "en": "An -ing subject is singular."}}, {"s": "Keeping the records accurate ___ difficult for the clerks.", "o": ["was", "were", "are", "have been"], "w": {"tr": "-ing özne tekil → was.", "en": "An -ing subject is singular, so 'was'."}}]}, {"id": "f3", "ok": "He considered them (the forks) dangerous.", "bad": "He considered it (the forks) dangerous.", "t": {"tr": "Zamir, yerini tuttuğu isme uyar", "en": "A pronoun matches the noun it replaces"}, "r": {"tr": "Tekil isim (company, team, committee) → it / its. Çoğul isim (forks, scientists) → they / them / their.", "en": "A singular noun (company, team, committee) takes it / its. A plural noun (forks, scientists) takes they / them / their."}, "q": [{"s": "The company announced that ___ would open a new factory.", "o": ["it", "they", "we", "one"], "w": {"tr": "'company' tekil → it.", "en": "'company' is singular, so 'it'."}}, {"s": "Forks were rare in medieval Europe, and many people considered ___ unnecessary.", "o": ["them", "it", "this", "that"], "w": {"tr": "'Forks' çoğul → them.", "en": "'Forks' is plural, so 'them'."}}, {"s": "The committee released ___ final report on Friday.", "o": ["its", "their", "it's", "they're"], "w": {"tr": "'committee' tekil → its.", "en": "'committee' is singular, so 'its'."}}]}, {"id": "f4", "ok": "The octopus can change its color.", "bad": "The octopus can change it's color.", "t": {"tr": "its / it's — their / there / they're", "en": "its / it's — their / there / they're"}, "r": {"tr": "its = onun (iyelik), it's = it is. their = onların, there = orada, they're = they are. 'its'' diye bir şey yok.", "en": "its = belonging to it; it's = it is. their = belonging to them; there = in that place; they're = they are. There is no such word as its'."}, "q": [{"s": "The octopus can change ___ color in less than a second.", "o": ["its", "it's", "its'", "their"], "w": {"tr": "İyelik → its (kesme işaretsiz).", "en": "Possession, so 'its' with no apostrophe."}}, {"s": "The students left ___ notebooks in the lab.", "o": ["their", "there", "they're", "theirs"], "w": {"tr": "Onların → their.", "en": "Belonging to them, so 'their'."}}, {"s": "___ likely that the ruins are older than first thought.", "o": ["It's", "Its", "Its'", "It is'"], "w": {"tr": "It is likely → It's.", "en": "It is likely, so 'It's'."}}]}, {"id": "f5", "ok": "Place your hands between the two antennas.", "bad": "Place your hand's between the two antenna's.", "t": {"tr": "İyelik mi, çoğul mu?", "en": "Possessive or plural?"}, "r": {"tr": "Tekil iyelik: -'s (the phrase's). Çoğul: -s (hands). Çoğul iyelik: -s' (eagles' nests). Cümlede bir şeye sahip olma yoksa kesme işareti koyma.", "en": "Singular possessive: -'s (the phrase's). Plural: -s (hands). Plural possessive: -s' (eagles' nests). No ownership, no apostrophe."}, "q": [{"s": "The ___ new owner restored it completely.", "o": ["house's", "houses", "houses'", "house"], "w": {"tr": "Tek ev, sahiplik → house's.", "en": "One house, possession, so 'house's'."}}, {"s": "Both ___ nests were built on the cliff.", "o": ["eagles'", "eagle's", "eagles", "eagles's"], "w": {"tr": "Çok kartal + sahiplik → eagles'.", "en": "Many eagles plus possession, so 'eagles''."}}, {"s": "Place your ___ on the table.", "o": ["hands", "hand's", "hands'", "hand's'"], "w": {"tr": "Sahiplik yok, sadece çoğul → hands.", "en": "No possession, just plural, so 'hands'."}}]}, {"id": "f6", "ok": "In 2023, the team published a study.", "bad": "In 2023, the team publishing a study.", "t": {"tr": "Cümlenin çekimli bir yüklemi olmalı", "en": "A sentence needs a finite verb"}, "r": {"tr": "Her cümlenin çekimli bir yüklemi olmalı (published, illuminates). '-ing', 'to…', 'having…' tek başına yüklem olamaz.", "en": "Every sentence needs a real, conjugated verb (published, illuminates). An -ing word, a to-verb, or 'having…' cannot be the main verb on its own."}, "q": [{"s": "In 2023, the team ___ a study on whale genes.", "o": ["published", "publishing", "having published", "to publish"], "w": {"tr": "Cümlenin yüklemi lazım → published.", "en": "The sentence needs a main verb, so 'published'."}}, {"s": "The lamp inside the sculpture ___ the glass.", "o": ["illuminates", "illuminating", "to illuminate", "having illuminated"], "w": {"tr": "Çekimli yüklem → illuminates.", "en": "A finite verb: 'illuminates'."}}, {"s": "The volcano, which had been quiet for centuries, ___ in 1980.", "o": ["erupted", "erupting", "to erupt", "having erupted"], "w": {"tr": "'which…' ek bilgi; ana yüklem eksik → erupted.", "en": "The 'which…' part is extra; the main verb is missing, so 'erupted'."}}]}, {"id": "f7", "ok": "A decade later, Land used the filter.", "bad": "A decade later, Land uses the filter.", "t": {"tr": "Zaman uyumu", "en": "Tense consistency"}, "r": {"tr": "Fiil zamanı metindeki zaman ifadesine uyar: 'in 1939' → geçmiş; 'each night' → geniş zaman; 'by the time … arrived' → had + V3.", "en": "Match the verb tense to the time words in the text: 'in 1939' means past; 'each night' means present; 'by the time … arrived' means had + past participle."}, "q": [{"s": "In 1929 Land invented a filter. A decade later, he ___ it to build a camera.", "o": ["used", "uses", "will use", "is using"], "w": {"tr": "Geçmişte bir olay → used.", "en": "An event in the past, so 'used'."}}, {"s": "Each night, a lamp inside the tree ___ the green bottles.", "o": ["lights", "lit", "will have lit", "had lit"], "w": {"tr": "Her gece tekrar eden durum → geniş zaman.", "en": "Something that happens every night, so simple present."}}, {"s": "By the time the rescue team arrived, the hikers ___ the summit.", "o": ["had reached", "reach", "will reach", "are reaching"], "w": {"tr": "Geçmişteki bir andan önce → had reached.", "en": "Before a moment in the past, so 'had reached'."}}]}, {"id": "f8", "ok": "Using a telescope, the astronomer spotted a comet.", "bad": "Using a telescope, a comet was spotted.", "t": {"tr": "Sarkan niteleyici (dangling modifier)", "en": "Dangling modifier"}, "r": {"tr": "Cümle 'Born in…, Using…, Exhausted…' gibi bir ifadeyle başlıyorsa, virgülden hemen sonra o işi yapan kişi/şey gelmelidir.", "en": "If a sentence opens with a phrase like 'Born in…, Using…, Exhausted…', the person or thing doing that action must come right after the comma."}, "q": [{"s": "Born in a small village, ___", "o": ["the poet wrote about rural life.", "rural life was the poet's subject.", "the poems described rural life.", "rural life filled the poet's work."], "w": {"tr": "Köyde doğan kişi şair → virgülden sonra 'the poet'.", "en": "The poet was born in the village, so 'the poet' comes right after the comma."}}, {"s": "Using a telescope, ___", "o": ["the astronomer spotted a new comet.", "a new comet was spotted.", "the comet appeared to the astronomer.", "a discovery was made by the astronomer."], "w": {"tr": "Teleskobu kullanan → astronomer.", "en": "The one using the telescope is the astronomer."}}, {"s": "Exhausted after the race, ___", "o": ["the runner sat down.", "the bench was where the runner sat.", "sitting down was what the runner did.", "the runner's shoes were left by the door."], "w": {"tr": "Yorgun olan → the runner.", "en": "The one who is exhausted is the runner."}}]}];
var GANIM={"b1": {"bad": [["The museum closed early", "A"], [",", "X"], [" the storm had cut the power.", "B"]], "ok": [["The museum closed early", "A"], [";", "F"], [" the storm had cut the power.", "B"]], "lab": {"tr": {"A": "tam cümle 1", "B": "tam cümle 2"}, "en": {"A": "sentence 1", "B": "sentence 2"}}, "n": {"tr": ["Bu cümlede iki parça var. İkisinin de öznesi ve yüklemi var. Yani ikisi de tek başına tam bir cümle.", "Aralarında sadece virgül var. Virgül iki tam cümleyi bağlayamaz. Buna {comma splice} denir ve SAT bunu çok sorar.", "Çözüm: noktalı virgül, nokta, ya da virgül artı {and, but, so} gibi bir bağlaç.", "Kısaca: iki tam cümle, tek bir virgülle birleşmez."], "en": ["This sentence has two parts. Each part has its own subject and verb, so each one is a complete sentence.", "Only a comma sits between them. A comma cannot join two complete sentences. This is called a comma splice, and the SAT tests it a lot.", "The fix: a semicolon, a period, or a comma plus a word like and, but, or so.", "In short: two complete sentences never join with just a comma."]}}, "b2": {"bad": [["The trail is short", "A"], [" but,", "X"], [" it climbs steeply.", "B"]], "ok": [["The trail is short", "A"], [", but", "F"], [" it climbs steeply.", "B"]], "lab": {"tr": {"A": "tam cümle 1", "B": "tam cümle 2"}, "en": {"A": "sentence 1", "B": "sentence 2"}}, "n": {"tr": ["İki tam cümle, {but} bağlacıyla birleşiyor.", "Virgül yanlış yerde. Bağlacın arkasına konmuş.", "Doğrusu: virgül bağlacın önüne gelir. Önce virgül, sonra {but}.", "Kısaca: iki tam cümleyi {and, but, so, yet, or} ile bağlarken virgül bağlaçtan önce gelir."], "en": ["Two complete sentences are joined by the word but.", "The comma is in the wrong place. It comes after the conjunction.", "Correct: the comma comes before the conjunction. Comma first, then but.", "In short: when and, but, so, yet, or joins two sentences, the comma goes before the conjunction."]}}, "b3": {"bad": [["The recipe needs", "A"], [":", "X"], [" flour, water, and salt.", "C"]], "ok": [["The recipe needs three ingredients", "A"], [":", "F"], [" flour, water, and salt.", "C"]], "lab": {"tr": {"A": "iki noktadan önceki kısım", "C": "liste"}, "en": {"A": "before the colon", "C": "list"}}, "n": {"tr": ["İki noktadan önceki kısma bak: {The recipe needs.} Neye ihtiyaç var? Cümle yarım kalmış.", "Yarım cümleden sonra iki nokta konmaz.", "Önce cümleyi tamamla: {The recipe needs three ingredients.} Artık tam cümle, iki nokta koyabiliriz.", "Kısaca: iki noktadan önce, tek başına tam bir cümle olmalı."], "en": ["Look at the part before the colon: The recipe needs. Needs what? The sentence is unfinished.", "A colon cannot follow an unfinished sentence.", "Finish the sentence first: The recipe needs three ingredients. Now it is complete, so the colon works.", "In short: before a colon, you need a sentence that could stand on its own."]}}, "b4": {"bad": [["Because the soil was dry", "A"], [";", "X"], [" the farmers waited.", "B"]], "ok": [["Because the soil was dry", "A"], [",", "F"], [" the farmers waited.", "B"]], "lab": {"tr": {"A": "yan cümle (Because…)", "B": "tam cümle"}, "en": {"A": "dependent clause (Because…)", "B": "complete sentence"}}, "n": {"tr": ["İlk kısım {Because} ile başlıyor. Bu bir yan cümle. Tek başına cümle olamaz.", "Noktalı virgül nokta gibidir. İki yanında da tam cümle ister. Burada sol taraf tam değil.", "Yan cümleden sonra virgül kullanılır.", "Kısaca: noktalı virgülün iki tarafı da tam cümle olmalı."], "en": ["The first part starts with Because. That makes it a dependent clause. It cannot stand alone.", "A semicolon works like a period. It needs a complete sentence on both sides. Here the left side is not complete.", "After a dependent clause, use a comma.", "In short: both sides of a semicolon must be complete sentences."]}}, "b5": {"bad": [["Kepler", "A"], ["—who studied planets", "C"], [",", "X"], [" was also an astrologer.", "B"]], "ok": [["Kepler", "A"], ["—who studied planets", "C"], ["—", "F"], [" was also an astrologer.", "B"]], "lab": {"tr": {"A": "özne", "C": "ek bilgi", "B": "yüklem"}, "en": {"A": "subject", "C": "extra information", "B": "verb"}}, "n": {"tr": ["Ortadaki {who studied planets} kısmı ek bilgi. Cümleden çıkarsan cümle yine tam kalır.", "Ek bilgi tireyle açılmış ama virgülle kapanmış. Çift uyuşmuyor.", "Tireyle açtıysan tireyle kapatırsın. Virgülle açtıysan virgülle.", "Kısaca: ek bilgi bir çift işaretle açılır ve aynı işaretle kapanır."], "en": ["The middle part, who studied planets, is extra information. Remove it and the sentence is still complete.", "The extra information opens with a dash but closes with a comma. The pair does not match.", "If you open with a dash, close with a dash. If you open with a comma, close with a comma.", "In short: extra information opens with a pair of marks and closes with the same mark."]}}, "b6": {"bad": [["The comedian", "A"], [",", "X"], [" Jemaine Clement", "C"], [",", "X"], [" voiced the crab.", "B"]], "ok": [["The comedian", "A"], [" Jemaine Clement", "C"], [" voiced the crab.", "B"]], "lab": {"tr": {"A": "özne", "C": "hangi komedyen?", "B": "yüklem"}, "en": {"A": "subject", "C": "which comedian?", "B": "verb"}}, "n": {"tr": ["Sadece {the comedian} dersek hangi komedyen olduğunu bilemeyiz. İsim, kim olduğunu belirliyor.", "Belirleyici bilgi gerekli bilgidir. Virgüllerle ayrılmaz.", "Virgülleri kaldırıyoruz. İsim özneye yapışıyor.", "Kısaca: kimden bahsedildiğini belirleyen bilgi virgülsüz yazılır. {That} ile başlayan kısım da her zaman virgülsüz."], "en": ["If we only say the comedian, we do not know which comedian. The name identifies the person.", "Identifying information is essential. It is not set off with commas.", "Remove the commas. The name attaches to the subject.", "In short: information that identifies who or what you mean has no commas. A clause starting with that never has commas."]}}, "b7": {"bad": [["The scientists who studied the samples", "A"], [",", "X"], [" concluded that the assed", "A"], [",", "F"], [" the crew repaired the roof.", "B"]], "lab": {"tr": {"A": "giriş", "B": "asıl cümle"}, "en": {"A": "opening", "B": "main sentence"}}, "n": {"tr": ["Cümle {after the storm passed} diye bir girişle başlıyor. Asıl cümle: {the crew repaired the roof.}", "Girişin bittiği yerde bir işaret eksik.", "Girişten sonra virgül koyuyoruz.", "Kısaca: {after, although, because} ya da {to} ile başlayan girişten sonra virgül gelir."], "en": ["The sentence opens with after the storm passed. The main sentence is the crew repaired the roof.", "A mark is missing where the opening ends.", "Add a comma after the opening.", "In short: after an opening that starts with after, although, because, or to, add a comma."]}}, "b10": {"bad": [["The kit includes", "A"], [",", "X"], [" a map, a compass, and a whistle.", "C"]], "ok": [["The kit includes", "A"], [" a map, a compass, and a whistle.", "C"]], "lab": {"tr": {"A": "yüklem", "C": "liste"}, "en": {"A": "verb", "C": "list"}}, "n": {"tr": ["Burada üç öğeli bir liste var: {a map, a compass, a whistle.}", "Listenin ilk öğesinden önce virgül konmuş. Bu yanlış.", "Öğelerin arasına virgül koy, ama ilk öğeden önce koyma.", "Kısaca: liste öğelerini virgülle ayır. Listeye girerken virgül yok."], "en": ["Here is a list of three items: a map, a compass, a whistle.", "There is a comma before the first item of the list. That is wrong.", "Put commas between the items, but not before the first one.", "In short: separate list items with commas. No comma when the list begins."]}}, "f1": {"bad": [["The collection", "A"], [" of ancient coins", "C"], [" are", "X"], [" displayed.", "B"]], "ok": [["The collection", "A"], [" of ancient coins", "C"], [" is", "F"], [" displayed.", "B"]], "lab": {"tr": {"A": "gerçek özne (tekil)", "C": "araya giren kısım", "B": ""}, "en": {"A": "real subject (singular)", "C": "phrase in between", "B": ""}}, "n": {"tr": ["Ne sergileniyor? Koleksiyon. Gerçek özne {collection}, yani tekil.", "Araya giren {of ancient coins} çoğul olduğu için {are} yazılmış. Tuzak bu.", "Araya gireni yok say, özneye bak: {the collection is.}", "Kısaca: {of} ile başlayan kısmı yok say, yüklemi gerçek özneye uydur."], "en": ["What is on display? The collection. The real subject is collection, so it is singular.", "The phrase in between, of ancient coins, is plural, so someone wrote are. That is the trap.", "Ignore the phrase in between and look at the subject: the collection is.", "In short: ignore the phrase starting with of, and match the verb to the real subject."]}}, "f2": {"bad": [["Using public domain songs", "A"], [" ensure", "X"], [" that the film is legal.", "B"]], "ok": [["Using public domain songs", "A"], [" ensures", "F"], [" that the film is legal.", "B"]], "lab": {"tr": {"A": "özne: tek bir eylem", "B": ""}, "en": {"A": "subject: one action", "B": ""}}, "n": {"tr": ["Öznenin başında {using} var. Yani özne bir eylem: şarkıları kullanmak.", "{Songs} çoğul diye {ensure} yazılmış. Ama özne tek bir eylem.", "Tekil yüklem kullanıyoruz: {ensures.}", "Kısaca: {i n g} ya da {to} ile başlayan özne tekildir."], "en": ["The subject starts with using. So the subject is an action: using the songs.", "Because songs is plural, someone wrote ensure. But the subject is one action.", "Use a singular verb: ensures.", "In short: a subject that starts with an ing word or with to is singular."]}}, "f3": {"bad": [["The committee", "A"], [" released", "B"], [" their", "X"], [" report.", "C"]], "ok": [["The committee", "A"], [" released", "B"], [" its", "F"], [" report.", "C"]], "lab": {"tr": {"A": "tekil isim", "B": "yüklem", "C": ""}, "en": {"A": "singular noun", "B": "verb", "C": ""}}, "n": {"tr": ["{The committee}, yani kurul. İçinde çok kişi olsa da tek bir grup. Tekil.", "{Their} çoğul zamir. Tekil isme uymaz.", "Tekil isim için {its} kullanıyoruz.", "Kısaca: zamir, yerini tuttuğu isimle sayıca aynı olmalı. {Company, team, committee} için {it} ve {its.}"], "en": ["The committee has many people, but it is one group. It is singular.", "Their is a plural pronoun. It does not match a singular noun.", "For a singular noun, use its.", "In short: a pronoun must match its noun in number. Company, team, and committee take it and its."]}}, "f4": {"bad": [["The octopus can change", "A"], [" it's", "X"], [" color.", "C"]], "ok": [["The octopus can change", "A"], [" its", "F"], [" color.", "C"]], "lab": {"tr": {"A": "", "C": "kimin rengi? ahtapotun"}, "en": {"A": "", "C": "whose color? the octopus's"}}, "n": {"tr": ["Burada ahtapotun rengi kastediliyor. Yani sahiplik var.", "{It's}, yani {it is.} {It is color} anlamsız.", "Sahiplik için kesme işaretsiz {its.}", "Kısaca: {its} onun demek, {it's} ise {it is.} {Their} onların, {there} orada, {they're} ise {they are.}"], "en": ["The color belongs to the octopus. So this is possession.", "It's means it is. It is color makes no sense.", "For possession, use its with no apostrophe.", "In short: its shows possession, it's means it is. Their is possession, there is a place, they're means they are."]}}, "f5": {"bad": [["Place your", "A"], [" hand's", "X"], [" on the table.", "B"]], "ok": [["Place your", "A"], [" hands", "F"], [" on the table.", "B"]], "lab": {"tr": {"A": "", "B": ""}, "en": {"A": "", "B": ""}}, "n": {"tr": ["Burada eller hiçbir şeye sahip değil. Sadece çoğul.", "Kesme işareti sahiplik gösterir. Sahiplik yoksa konmaz.", "Sadece s ekliyoruz: {hands.}", "Kısaca: tekil sahiplikte kesme ve s, çoğulda sadece s, çoğul sahiplikte s ve kesme."], "en": ["The hands do not own anything here. They are just plural.", "An apostrophe shows possession. No possession means no apostrophe.", "Just add s: hands.", "In short: singular possessive is apostrophe s, plural is just s, plural possessive is s apostrophe."]}}, "f6": {"bad": [["In 2023,", "A"], [" the team", "B"], [" publishing", "X"], [" a study.", "C"]], "ok": [["In 2023,", "A"], [" the team", "B"], [" published", "F"], [" a study.", "C"]], "lab": {"tr": {"A": "", "B": "özne", "C": ""}, "en": {"A": "", "B": "subject", "C": ""}}, "n": {"tr": ["Özne {the team.} Peki takım ne yaptı?", "{Publishing} tek başına yüklem olamaz. Cümle yarım kalıyor.", "Çekimli bir yüklem lazım: {published.}", "Kısaca: her cümlenin çekimli bir yüklemi olmalı. {i n g}, {to} ve {having} tek başına yetmez."], "en": ["The subject is the team. So what did the team do?", "Publishing cannot be the main verb on its own. The sentence stays unfinished.", "We need a finite verb: published.", "In short: every sentence needs a finite verb. An ing word, to, or having is not enough on its own."]}}, "f7": {"bad": [["A decade later,", "A"], [" Land", "B"], [" uses", "X"], [" the filter.", "C"]], "ok": [["A decade later,", "A"], [" Land", "B"], [" used", "F"], [" the filter.", "C"]], "lab": {"tr": {"A": "zaman ipucu: geçmiş", "B": "özne", "C": ""}, "en": {"A": "time clue: past", "B": "subject", "C": ""}}, "n": {"tr": ["{A decade later}, geçmişte olmuş bir olayı anlatıyor. Metin geçmiş zamanda.", "{Uses} geniş zaman. Metnin zamanıyla uyuşmuyor.", "Geçmiş zaman kullanıyoruz: {used.}", "Kısaca: zaman ipucunu bul. {In 1939} geçmiş zaman, {each night} geniş zaman, {by the time} ise {had.}"], "en": ["A decade later describes an event in the past. The text is in the past tense.", "Uses is present tense. It does not match the text.", "Use the past tense: used.", "In short: find the time clue. In 1939 means past, each night means present, by the time means had."]}}, "f8": {"bad": [["Using a telescope,", "A"], [" a comet was spotted.", "X"]], "ok": [["Using a telescope,", "A"], [" the astronomer", "F"], [" spotted a comet.", "B"]], "lab": {"tr": {"A": "giriş: kim kullanıyor?", "B": ""}, "en": {"A": "opening: who is using it?", "B": ""}}, "n": {"tr": ["{Using a telescope}, yani teleskop kullanarak. Peki teleskobu kim kullanıyor?", "Virgülden hemen sonra {a comet} gelmiş. Kuyruklu yıldız teleskop kullanamaz.", "Virgülden sonra işi yapan kişi gelmeli: {the astronomer.}", "Kısaca: giriş ifadesinden sonra, virgülün hemen arkasına o işi yapan gelir."], "en": ["Using a telescope. So who is using the telescope?", "Right after the comma comes a comet. A comet cannot use a telescope.", "The one doing the action must come after the comma: the astronomer.", "In short: after an opening phrase, the doer of that action comes right after the comma."]}}};

var CURR=[
{id:"sec",k:"rule",n:"Standard English Conventions",pct:"26% of R&W",
 d:"Rules you can memorize. No vocabulary needed. Fastest points.",items:[
["Comma splice","Never join two complete sentences with only a comma. Use a period, a <code>;</code>, or <code>, and/but/so/for/or/nor/yet</code>.","İki tam cümle sadece virgülle birleşmez. Nokta, noktalı virgül veya virgül+bağlaç gerekir."],
["Semicolon = period","A <code>;</code> is as strong as a period. Both sides must be complete sentences.","Noktalı virgül nokta gücündedir. İki tarafı da tek başına cümle olmalı."],
["Colon","Before <code>:</code> you need a complete sentence. After it comes a list, an explanation, or an example.","İki noktadan önce tam cümle şart. Sonrası liste, açıklama veya örnek."],
["No comma between subject and verb","<i>The scientist who ran the study</i> continues with no comma. A long phrase in the middle does not create one.","Özne ile yüklem arasına virgül girmez. Araya giren uzun ifade seni kandırmasın."],
["Matching marks","A break in the middle must open and close with the SAME mark: <code>—...—</code> or <code>,...,</code>. Never mix them.","Araya giren açıklama hangi işaretle açıldıysa aynısıyla kapanır. Karışık kullanılmaz."],
["Singular possessive <code>'s</code>","<i>the student's book</i> — one student.","Tek kişide apostrof + s."],
["Plural possessive <code>s'</code>","<i>the students' books</i> — more than one. Also <i>snow grains' properties</i>.","Çoğul iyelikte apostrof s'den SONRA gelir."],
["Irregular plurals","<i>children's, women's, people's</i> — if the plural does not end in <code>s</code>, use <code>'s</code>.","Düzensiz çoğul s ile bitmiyorsa normal kural: 's."],
["Plural only = no apostrophe","<i>stories of the immigrants</i> — plural, no ownership, so no apostrophe. The most common trap.","Sahiplik yoksa apostrof da yok. En sık tuzak."],
["its / it's","<code>its</code> = ownership. <code>it's</code> = it is. An apostrophe does not mean ownership here.","its iyelik, it's = it is. Apostrof burada iyelik demek değil."],
["their / there / they're","<code>their</code> = ownership, <code>there</code> = place, <code>they're</code> = they are.","their iyelik, there yer, they're = they are."],
["whose / who's","<code>whose</code> = ownership, <code>who's</code> = who is.","whose iyelik, who's = who is."],
["Subject-verb agreement","Cross out the words in the middle and find the real subject. <i>The box of pencils <b>is</b></i> — the subject is <i>box</i>.","Araya giren ifadeyi sil, gerçek özneyi bul."],
["Collective nouns are singular","<i>the team, the committee, the group</i> take a singular verb.","Toplu isimler tekil fiil alır."],
["Indefinite pronouns are singular","<i>each, every, either, neither, everyone, someone</i> take a singular verb.","Belirsiz zamirler tekildir."],
["one of the X who","<i>one of the students who <b>have</b></i> — <i>who</i> refers to <i>students</i>, so the verb is plural.","who, students'a bağlanır; fiil çoğul olur."],
["Clear pronoun reference","A pronoun must point to ONE clear noun. If <i>it, they, this</i> could mean two things, the choice is wrong.","Zamir tek bir isme işaret etmeli, belirsizse yanlıştır."],
["Modifier placement","The subject right after an opening phrase must be the one doing it. <i>Running late, <b>she</b> missed the bus.</i>","Giriş ifadesinden sonraki özne, o eylemi yapan kişi olmalı."],
["Parallel structure","Items in a list must share the same form: <i>reading, writing, and speaking</i>.","Listede hepsi aynı gramer yapısında olmalı."],
["Logical comparison","Compare like with like: <i>Tolstoy's novels</i> vs <i>Dickens's novels</i>. You cannot compare a novel to a writer.","Benzer şeyler karşılaştırılır. Roman ile yazar karşılaştırılmaz."],
["Tense consistency","Do not jump between tenses without a reason. Look for the time words in the sentence.","Gereksiz zaman atlaması olmamalı. Zaman işaretçilerine bak."],
["Every sentence needs a real verb","<i>being, to be, having been</i> are not verbs on their own. You need <i>is, was, will be</i>.","being / to be tek başına fiil değildir. Çekimli fiil gerekir."],
["that vs which","If the information defines the noun, use <code>that</code> with no comma. If it is extra, use <code>, which</code>.","Tanımlıyorsa that (virgülsüz), ek bilgiyse which (virgüllü)."],
["List commas","Three or more items: a comma after each. If the items already contain commas, use <code>;</code> instead.","Üç ve daha fazla öğede her öğeden sonra virgül."],
["Transition meaning","<i>however</i> = contrast, <i>therefore</i> = result, <i>moreover</i> = addition, <i>for example</i> = example. Find the relationship first.","Önce iki cümlenin ilişkisini bul, sonra bağlacı seç."],
["Dependent clauses","A clause starting with <i>because, although, when, if, while, since, after</i> is not a sentence. It must attach to a main clause.","Bu bağlaçlarla başlayan parça cümle değildir, ana cümleye bağlanmalı."],
["Comma after an opening element","<i>In 1920, …</i> / <i>After the war, …</i> / <i>Although it rained, …</i>","Giriş ifadesi bitince virgül gelir."],
["Appositives take two commas","<i>Marie Curie, a physicist, won…</i> — an extra noun phrase needs a comma on BOTH sides.","Açıklayıcı isim iki virgülle sarılır, biri eksik olmaz."],
["such as","Use <i>, such as</i> when the examples are extra. No comma when they define the noun.","Ek bilgiyse virgüllü, tanımlıyorsa virgülsüz."],
["Tense clues","<i>since / over the past decade</i> → present perfect (<i>has been</i>). <i>in 1998 / last year</i> → simple past.","since ⟶ present perfect, in 1998 ⟶ simple past."]
]},
{id:"info",k:"info",n:"Information and Ideas",pct:"26% of R&W",
 d:"Getting information out of the text. Evidence questions are technique; main idea questions need real reading.",items:[
["Central Ideas","Pick the choice that covers the WHOLE text. A choice that is true but only summarises one sentence is a trap. Ask yourself: why did the writer write this?","Metnin tamamını kapsayan şıkkı seç. Tek cümleyi özetleyen doğru şık tuzaktır."],
["Details","Find the key word from the question in the text, then read the two sentences around it. The answer is there. Do not infer.","Anahtar kelimeyi metinde bul, çevresini oku. Çıkarım yapma."],
["Command of Evidence (text)","Find the quotation that literally DOES what the claim says. The other three are often true but prove something else. Underline the key verb in the claim, then look for it.","İddiadaki fiili birebir yapan alıntıyı bul. Diğerleri doğru ama başka şeyi kanıtlar."],
["Command of Evidence (graph)","Read the axes and the units FIRST, not the shape. Then check each choice against the numbers. A correct reading of the graph that does not match the text is still wrong.","Önce eksenleri ve birimleri oku, sonra şıkları veriyle doğrula."],
["Inferences","The blank is at the end. Follow the logic before it. Never add information that is not in the text. The safest, least extreme choice is usually right.","Boşluk sondadır. Metinde yazandan fazlasını ekleme; en az iddialı şık genelde doğrudur."],
["Trap answers","Four classic traps: too broad, too narrow, outside information, true but not the question. For every choice you cross out, you should be able to name which trap it is.","Dört tuzak: çok geniş, çok dar, metin dışı bilgi, doğru ama ilgisiz."]
]},
{id:"craft",k:"craft",n:"Craft and Structure",pct:"28% of R&W",
 d:"The biggest area. Vocabulary, and how a text is built.",items:[
["Words in Context — method","Before you look at the choices, put your OWN word in the blank. Then pick the closest choice. If you start from the choices, all four look possible.","Şıklara bakmadan boşluğa kendi kelimeni koy, sonra en yakın şıkkı seç."],
["Context clues","Contrast: <i>but, however, although, yet, despite, while</i> → the blank means the opposite. Same direction: <i>and, similarly, likewise</i>. Result: <i>thus, therefore, so</i>. Circle these words.","Zıtlık bağlaçları varsa boşluk tersini söyler. Bu bağlaçları daire içine al."],
["Second meanings","SAT tests the less common meaning: <i>answers</i> = satisfies, <i>address</i> = deal with, <i>yield</i> = produce, <i>check</i> = stop, <i>reserved</i> = shy, <i>compromise</i> = weaken, <i>qualify</i> = limit, <i>sound</i> = solid, <i>novel</i> = new, <i>table</i> = postpone, <i>sustain</i> = support.","SAT kelimenin bilinen anlamını değil ikincil anlamını sorar."],
["Text Structure and Purpose","The question asks what the text DOES, not what it says: does it introduce, compare, object, or give an example? Look at the verbs in the choices (<i>illustrate, challenge, introduce, question</i>).","Metnin ne dediğini değil ne yaptığını sorar. Şıklardaki fiillere bak."],
["Function of a sentence","Read the underlined sentence together with the one before and the one after. Is it supporting a claim, making a transition, or raising an objection?","Altı çizili cümleyi öncesi ve sonrasıyla oku; görevi ne?"],
["Cross-Text Connections","Two texts. First write each writer's position in ONE sentence in your own words. Then ask: does the second writer agree, add, or disagree? One of the hardest types on the test.","İki metin. Önce her yazarın pozisyonunu tek cümlede yaz, sonra ilişkiyi belirle."],
["Reading literary texts","Older literary English is hard for most test takers. Ask three questions: WHO? WHAT do they feel? WHICH WAY is that feeling moving? Skip the decoration, catch the direction.","Edebi metinde üç soru: kim, ne hissediyor, his hangi yöne gidiyor?"]

{id:"expr",k:"expr",n:"Expression of Ideas",pct:"20% of R&W",
 d:"Transitions and note synthesis. Both are technique — learn them once and they are done.",items:[
["Transitions — method","Cover the blank. Read the sentence before and the sentence after. Say the relationship out loud (but / also / so / for example). Then pick the choice that gives that relationship. Never start from the choices.","Boşluğu kapat, iki cümlenin ilişkisini söyle, sonra o ilişkiyi veren şıkkı seç."],
["Transition word list","<b>Contrast:</b> however, nevertheless, nonetheless, in contrast, on the other hand, conversely, still, yet.<br><b>Addition:</b> moreover, furthermore, in addition, also, similarly, likewise.<br><b>Result:</b> therefore, thus, consequently, as a result, hence, accordingly.<br><b>Example:</b> for example, for instance, specifically, namely, in particular.<br><b>Sequence:</b> first, then, subsequently, finally, meanwhile.<br><b>Emphasis:</b> indeed, in fact, of course, admittedly, granted.","Zıtlık / ekleme / sonuç / örnek / sıra / vurgu. Altı kategori, ezberlenir."],
["Rhetorical Synthesis — method","Notes are given with a GOAL. Underline the goal: <i>emphasize a similarity</i>, <i>explain the purpose</i>, <i>introduce X to an unfamiliar audience</i>. Then look only for the choice that does that goal.","Verilen hedefin altını çiz, sadece o hedefi yapan şıkkı ara."],
["Common goals","Emphasize a similarity / emphasize a difference / state a result / introduce a group / explain a method. If the goal is similarity, the choice must mention BOTH items and one SHARED feature.","Benzerlik isteniyorsa şıkta iki öğe de geçmeli ve ortak bir özellik söylenmeli."],
["The synthesis trap","A choice that uses the notes correctly but does not do the goal. All four can be factually true — the difference is the goal, not the facts.","Bilgi doğru ama hedefi yapmayan şık. Ayrım doğrulukta değil, hedefte."]

/* ---------- yardımcılar ---------- */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function ymd(d){var y=d.getFullYear(),m=("0"+(d.getMonth()+1)).slice(-2),a=("0"+d.getDate()).slice(-2);return y+"-"+m+"-"+a;}
var DAY_START_H=4;   /* yeni gün 04:00'te başlar / a new day starts at 04:00 */
function today(){var d=new Date(Date.now()-DAY_START_H*3600000);d.setHours(0,0,0,0);return d;}
function todayStr(){return ymd(today());}
function addDays(ds,n){var d=new Date(ds+"T00:00:00");d.setDate(d.getDate()+n);return ymd(d);}
function daysBetween(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000);}
function dowOf(ds){return new Date(ds+"T00:00:00").getDay();}
function nowMs(){return Date.now();}
function slug(s){return String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,80)||"w";}

/* ---------- dil / language ---------- */
var LANG="tr";
function t(k){
  var s=(I18N[LANG]&&I18N[LANG][k]!==undefined)?I18N[LANG][k]:(I18N.en[k]!==undefined?I18N.en[k]:k);
  if(typeof s!=="string") return s;
  for(var i=1;i<arguments.length;i++) s=s.split("{"+(i-1)+"}").join(arguments[i]);
  return s;
}
function L(o){ return (o&&typeof o==="object")?(o[LANG]!==undefined?o[LANG]:o.en):o; }  /* {tr,en} → current */
function fmtDate(ds){var d=new Date(ds+"T00:00:00"),m=t("mons")[d.getMonth()];
  return LANG==="tr"?(d.getDate()+" "+m+" "+d.getFullYear()):(m+" "+d.getDate()+", "+d.getFullYear());}
function applyI18n(){
  document.documentElement.lang=LANG;
  var a=document.querySelectorAll("[data-i]"); for(var i=0;i<a.length;i++) a[i].textContent=t(a[i].getAttribute("data-i"));
  var b=document.querySelectorAll("[data-ip]"); for(var j=0;j<b.length;j++) b[j].placeholder=t(b[j].getAttribute("data-ip"));
  $("appName").textContent=APP_NAME; document.title=APP_NAME;
  $("noteFab").title=t("inb_title"); $("gPill").title=t("g_score");
}

/* ---------- depolama / storage (IndexedDB, bellek yedeği) ---------- */
var DB=null, MEM=false;
var mem={kv:{},words:[],errors:[],tests:[],learned:{}};
var autoId={words:1,errors:1,tests:1};
function openDB(){
  return new Promise(function(res){
    var r;
    try{ r=indexedDB.open("prepline",1)   /* eski ad korunur: mevcut kullanıcıların verisi kaybolmasın */; }catch(e){ MEM=true; return res(); }
    r.onupgradeneeded=function(e){
      var d=e.target.result;
      ["words","errors","tests"].forEach(function(s){ if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:"id",autoIncrement:true}); });
      if(!d.objectStoreNames.contains("kv")) d.createObjectStore("kv",{keyPath:"k"});
      if(!d.objectStoreNames.contains("learned")) d.createObjectStore("learned",{keyPath:"id"});
    };
    r.onsuccess=function(){ DB=r.result; res(); };
    r.onerror=function(){ MEM=true; res(); };
    r.onblocked=function(){ MEM=true; res(); };
  });
}
function rq(r){return new Promise(function(res,rej){r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}
function sAll(s){
  if(MEM) return Promise.resolve(
    s==="learned"?Object.keys(mem.learned).map(function(k){return {id:k,v:mem.learned[k]};})
    :s==="kv"?Object.keys(mem.kv).map(function(k){return {k:k,v:mem.kv[k]};}):mem[s].slice());
  return rq(DB.transaction(s).objectStore(s).getAll());
}
function sPut(s,v){
  if(MEM){
    if(s==="kv"){ mem.kv[v.k]=v.v; return Promise.resolve(); }
    if(s==="learned"){ mem.learned[v.id]=v.v; return Promise.resolve(); }
    if(v.id==null){ v.id=autoId[s]++; mem[s].push(v); }
    else { var i=mem[s].findIndex(function(x){return x.id===v.id;}); if(i<0) mem[s].push(v); else mem[s][i]=v; }
    return Promise.resolve();
  }
  return rq(DB.transaction(s,"readwrite").objectStore(s).put(v));
}
function sDel(s,k){
  if(MEM){ if(s==="learned"){ delete mem.learned[k]; return Promise.resolve(); }
    mem[s]=mem[s].filter(function(x){return x.id!==k;}); return Promise.resolve(); }
  return rq(DB.transaction(s,"readwrite").objectStore(s)["delete"](k));
}
function sClear(s){
  if(MEM){ if(s==="kv")mem.kv={}; else if(s==="learned")mem.learned={}; else mem[s]=[]; return Promise.resolve(); }
  return rq(DB.transaction(s,"readwrite").objectStore(s).clear());
}
function getKV(k,def){
  if(MEM) return Promise.resolve(mem.kv[k]===undefined?def:mem.kv[k]);
  return rq(DB.transaction("kv").objectStore("kv").get(k)).then(function(r){return r===undefined?def:r.v;});
}
function setKV(k,v){ return sPut("kv",{k:k,v:v}); }
